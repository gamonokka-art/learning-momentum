<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standard Intensive Practice Set 01 | Learning Momentum</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#1b2940;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#112b48;color:white;padding:30px max(20px,calc((100vw - 800px)/2))}header small{color:#c6d9ed;letter-spacing:.06em;font-weight:700}h1{margin:10px 0;font-size:clamp(24px,4vw,32px)}header p{color:#dce7f2;margin:7px 0}main{max-width:820px;margin:auto;padding:24px 16px 55px}a{color:#12669b}.q{background:#fff;border:1px solid #dce4ee;border-radius:13px;padding:20px;margin:14px 0}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.7;font-weight:600}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center}.opt:has(input:checked){background:#e9f4ff;border-color:#146ba5}input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:15px;padding-top:12px;line-height:1.7}.correct{color:#14754b}.wrong{color:#af3f34}.btn{border:0;border-radius:9px;padding:12px 20px;background:#12669b;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}#score{font-size:21px;font-weight:700}footer{text-align:center;color:#607188;padding:18px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:16px}.sentence{font-size:16px}}</style></head><body><header><small>LEARNING MOMENTUM</small><h1>Standard Intensive Practice</h1><p>Set 01｜基本〜標準｜30問・解答目安15分</p></header><main><p><a href="index.html">← 集中演習の目次へ</a></p><p>全30問に回答すると採点できます。採点後に正解・日本語訳・解説を表示します。</p><p id="progress" aria-live="polite">0 / 30 回答済み</p><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>const questions=[["The customer service team handled the unexpected increase in inquiries remarkably (　　　) during the holiday season.","goodness|good|well|goodwill",2,"顧客対応チームは休暇シーズン中、問い合わせの予想外の増加に非常にうまく対応しました。","handledを修飾する副詞well。remarkablyはwellを強調します。","handle inquiries（問い合わせに対応する）／remarkably well（非常にうまく）"],["The company is looking for candidates (　　　) have experience managing international projects.","who|whom|whose|which",0,"会社は国際プロジェクトの管理経験を持つ候補者を探しています。","人を表すcandidatesを先行詞とする主格の関係代名詞who。","look for candidates（候補者を探す）／have experience doing（～した経験がある）"],["To avoid (　　　) important customer information, employees are required to back up their files at the end of each workday.","lost|to lose|lose|losing",3,"重要な顧客情報を失わないよう、従業員は毎日の終業時にファイルをバックアップする必要があります。","avoidの後には動名詞（-ing形）を置きます。","avoid doing（～することを避ける）／back up files（ファイルをバックアップする）"],["A surprisingly large (　　　) of customers have requested information about the company's new subscription service.","numerous|number|numerical|numbering",1,"驚くほど多くの顧客が新しい定額制サービスについて問い合わせています。","a large number of＋複数名詞で「多数の～」。","a large number of（多数の～）／subscription service（定額制サービス）"],["The company plans to introduce a more (　　　) pricing structure to attract small-business customers.","flexibility|flexibly|flexible|flex",2,"会社は小規模事業者を引きつけるため、より柔軟な料金体系の導入を計画しています。","pricing structureを修飾する形容詞flexible。","pricing structure（料金体系）／attract customers（顧客を引きつける）"],["The finance department has requested additional (　　　) regarding the proposed changes to the company's reimbursement policy.","information|inform|informative|informatively",0,"財務部は経費精算規定の変更案について追加情報を求めています。","additionalの後に不可算名詞informationを置きます。","additional information（追加情報）／reimbursement policy（経費精算規定）"],["The new distribution center, (　　　) opened last month, is expected to reduce delivery times significantly.","where|whose|whom|which",3,"先月開設された新しい配送センターは配送時間を大幅に短縮すると期待されています。","非制限用法の主格関係代名詞which。","distribution center（配送センター）／reduce delivery times（配送時間を短縮する）"],["Although the new printer model is available online, only a few electronics stores currently (　　　) it as part of their in-store product range.","manufacture|carry|produce|deliver",1,"新型プリンターはオンラインで購入できますが、店頭で取り扱う家電店は現在ごく少数です。","carryは「（店舗が商品を）取り扱う」。in-store product rangeが手掛かり。","carry a product（商品を取り扱う）／in-store product range（店頭で取り扱う商品群）"],["The marketing department has (　　　) completed its analysis of customer preferences and will present the findings tomorrow.","yet|ever|already|still",2,"マーケティング部は顧客の好みの分析をすでに終え、明日結果を発表します。","現在完了形has already completedで「すでに完了した」。","customer preferences（顧客の好み）／present the findings（調査結果を発表する）"],["The marketing department has prepared two advertising proposals, and the director will review both of (　　　) before making a final decision.","them|they|themselves|their",0,"マーケティング部が用意した広告案2件を、部長が最終決定前に両方確認します。","both of themのように前置詞ofの後には目的格を置きます。","both of them（それらの両方）／make a final decision（最終決定を下す）"],["(　　　) the customer's complaint, the service representative immediately contacted the technical support team.","Received|Receive|Reception|Receiving",3,"顧客の苦情を受け、担当者は直ちに技術サポートに連絡しました。","Receivingで能動の分詞構文を作ります。","receive a complaint（苦情を受ける）／technical support（技術サポート）"],["The updated employee handbook provides (　　　) detailed instructions on how to report workplace safety concerns.","exceptional|exceptionally|exception|except",1,"更新された社員ハンドブックには職場の安全上の懸念の報告方法が非常に詳しく記されています。","形容詞detailedを修飾する副詞exceptionally。","detailed instructions（詳しい説明・指示）／safety concerns（安全上の懸念）"],["Several conference rooms are available on the third floor, but (　　　) is large enough to accommodate more than 100 participants because even the largest room seats only 60.","every|each|none|either",2,"3階には複数の会議室がありますが、最大の部屋でも60人しか入れず、100人超を収容できる部屋はありません。","最大60席という条件からnone「どれも～ない」が唯一適切。","accommodate participants（参加者を収容する）／seat 60（60人を収容できる）"],["No other shipping company in the region can deliver packages as (　　　) as Express Logistics.","quickly|quick|quicker|quickest",0,"この地域でExpress Logisticsほど速く荷物を届けられる配送会社はありません。","as＋副詞原級＋as。deliverを修飾するquickly。","deliver packages（荷物を配達する）／as quickly as（～と同じくらい速く）"],["The newly appointed supervisor has developed a (　　　) relationship with employees in the customer support department.","friend|friendship|friendliness|friendly",3,"新任の監督者は顧客サポート部の従業員と友好的な関係を築いています。","friendlyは-lyで終わる形容詞です。","newly appointed（新たに任命された）／develop a friendly relationship（友好的な関係を築く）"],["The manager introduced a new scheduling system (　　　) allows employees to exchange shifts more easily.","whose|that|who|what",1,"管理者は従業員がより簡単に勤務を交換できる新しいシフト管理システムを導入しました。","systemを先行詞とする主格関係代名詞that。","scheduling system（勤務管理システム）／exchange shifts（シフトを交換する）"],["The regional manager expressed concern about the (　　　) of the latest shipment, which arrived three days after the scheduled delivery date.","lately|later|lateness|late",2,"地域責任者は予定より3日遅れた最新の出荷の遅延について懸念を示しました。","theとofの間には名詞latenessが必要です。","express concern about（～への懸念を表す）／scheduled delivery date（予定配達日）"],["The company currently uses an outdated inventory management system and plans to replace it with a more efficient (　　　) next year.","one|it|ones|another",0,"会社は古い在庫管理システムを来年もっと効率的なものに交換する予定です。","同種の別のシステムを表す代名詞one。","inventory management system（在庫管理システム）／replace A with B（AをBに取り替える）"],["All expense reports must be submitted (　　　) the end of the month to ensure timely reimbursement.","previous|previously|prior|before",3,"すべての経費報告書は、適時に払い戻しを受けられるよう、月末になる前に提出しなければなりません。","before the end of the monthで「月末より前に」。","expense reports（経費報告書）／before the end of the month（月末になる前に）"],["(　　　) in 1998, the company has expanded its operations to more than 20 countries.","Founding|Founded|Founder|Foundation",1,"1998年に設立された同社は20か国以上に事業を拡大してきました。","Founded in 1998は受動の分詞構文。","be founded（設立される）／expand operations（事業を拡大する）"],["The sales department is responsible for maintaining accurate customer (　　　) in the company's database.","recording|recorded|records|record",2,"営業部はデータベースの正確な顧客記録を維持する責任があります。","customer recordsは「顧客記録」。ここでは複数形が自然です。","be responsible for（～を担当している）／customer records（顧客記録）"],["The company provides new employees with an orientation handbook to help (　　　) understand workplace policies and procedures.","them|they|themselves|their",0,"会社は新入社員が職場の規則や手順を理解できるようオリエンテーション用の冊子を渡します。","help＋目的語them＋動詞原形understand。","provide A with B（AにBを提供する）／policies and procedures（規則と手順）"],["The startup plans to raise additional (　　　) from private investors to finance the development of its new product.","salary|revenue|income|capital",3,"その新興企業は新製品開発の資金を賄うため民間投資家から追加資金を調達する予定です。","raise capitalで「資金を調達する」。","raise capital（資金を調達する）／private investors（民間投資家）"],["The company has established a customer service center (　　　) clients can receive assistance in several languages.","whom|where|whose|which",1,"会社は顧客が複数言語で支援を受けられるサービスセンターを設置しました。","場所centerを説明する関係副詞where。","receive assistance（支援を受ける）／in several languages（複数の言語で）"],["(　　　) of the changes to the delivery schedule in advance, the warehouse staff were able to prepare the shipments without delays.","Informing|Having informed|Having been informed|To inform",2,"配送日程の変更を事前に知らされていたため、倉庫スタッフは遅延なく出荷を準備できました。","Having been informedは完了・受動の分詞構文。","be informed of（～について知らされる）／in advance（事前に）"],["The two departments have different responsibilities, and (　　　) is required to submit a separate monthly performance report.","each|both|all|other",0,"2つの部署は担当業務が異なり、それぞれが個別の月次報告書を提出する必要があります。","eachは単数扱いでisに一致します。","each（それぞれ）／monthly performance report（月次業績報告書）"],["The company is (　　　) reviewing its supplier contracts to identify opportunities for reducing operating costs.","current|currency|currents|currently",3,"会社は運営費削減の可能性を探るため現在仕入先との契約を見直しています。","進行形is reviewingを修飾する副詞currently。","review supplier contracts（仕入先との契約を見直す）／operating costs（運営費）"],["The company's new policy allows employees to work remotely on a (　　　) basis, depending on their responsibilities.","days|daily|day|daylong",1,"新しい方針では担当業務に応じて従業員が日常的に在宅勤務できます。","on a daily basisは定型表現。","on a daily basis（日常的に・毎日）／work remotely（遠隔で勤務する）"],["The project team prepared a detailed (　　　) of the expected expenses before requesting final budget approval.","estimator|estimated|estimate|estimating",2,"プロジェクトチームは予算の最終承認を求める前に予想経費の詳細な見積もりを作成しました。","a detailed estimate ofで「～の詳細な見積もり」。","a detailed estimate（詳細な見積もり）／budget approval（予算の承認）"],["The company's new office building is located in a (　　　) accessible area near the central railway station.","highly|high|height|higher",0,"会社の新しいオフィスビルは中央駅近くのアクセスしやすい地域にあります。","accessibleを修飾する副詞highly。","highly accessible（非常にアクセスしやすい）／be located in（～に位置する）"]];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');function progress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / '+questions.length+' 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}function render(){root.innerHTML='';questions.forEach((q,i)=>{let section=document.createElement('section');section.className='q';let h=document.createElement('h2');h.textContent='Q'+String(i+1).padStart(2,'0');section.append(h);let s=document.createElement('p');s.className='sentence';s.textContent=q[0];section.append(s);let opts=document.createElement('div');opts.className='opts';q[1].split('|').forEach((choice,k)=>{let label=document.createElement('label');label.className='opt';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;progress()});label.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+choice));opts.append(label)});section.append(opts);if(graded){let r=document.createElement('div');r.className='result';let p=document.createElement('p');p.className=picks[i]===q[2]?'correct':'wrong';p.textContent=(picks[i]===q[2]?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q[2])+') '+q[1].split('|')[q[2]];r.append(p);let t=document.createElement('p');t.textContent='日本語訳：'+q[3];r.append(t);let e=document.createElement('p');e.textContent='解説：'+q[4];r.append(e);let v=document.createElement('p');v.textContent='重要語句・表現：'+q[5];r.append(v);section.append(r)}root.append(section)});progress()}document.getElementById('grade').addEventListener('click',()=>{graded=true;let n=picks.filter((x,i)=>x===questions[i][2]).length;document.getElementById('score').textContent='結果：'+n+' / '+questions.length+' 問正解';render();document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});document.getElementById('reset').addEventListener('click',()=>{picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})});render();</script></body></html>
