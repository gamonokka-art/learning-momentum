<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Final Review</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}

</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">30 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Final Review / 05</span></div><p class="subtitle">Grammar &amp; Vocabulary Review ④</p><p class="details">制限時間10分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="https://gamonokka-art.github.io/learning-momentum/advanced/" style="color:#12669b;font-weight:650;text-decoration:none">← Advancedの目次へ</a></nav><div id="startPanel" class="start-panel"><p><strong>30問・制限時間10分</strong></p><p>準備ができたら「Start Test」を押してください。開始後に選択肢が有効になり、タイマーが動きます。</p><button class="btn" id="startButton" type="button">Start Test</button></div><div class="meta"><div class="meta-top"><span id="timer" role="timer">残り時間 10:00</span><span class="instructions">全30問・各問1つ選択してください</span><span id="progress">0 / 30 回答済み</span></div><div class="score-actions"><div id="scoreTop" role="status" aria-live="polite"></div><div id="topActions" class="top-actions"><button class="btn secondary" id="resetTop" type="button" hidden>Try Again</button></div></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset" type="button">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id":"FR-01","question":"The board has requested a detailed (　　　) of the proposed acquisition costs before making its final decision.","choices":["breakdown","breakthrough","drawback","turnover"],"answer":0,"translation":"取締役会は最終決定を下す前に、買収案にかかる費用の詳細な内訳を求めています。","explanation":"a detailed breakdown of costs は「費用の詳しい内訳」。breakthrough は画期的進展、drawback は欠点、turnover は売上高・離職率などを意味します。\n重要語句・表現：detailed breakdown（詳細な内訳）／proposed acquisition（買収案）／make a final decision（最終決定を下す）","source":"Q050"},{"id":"FR-02","question":"Neither the regional managers nor the chief operating officer (　　　) permitted to authorize expenditures exceeding the approved budget.","choices":["are","have","is","be"],"answer":2,"translation":"地域責任者も最高執行責任者も、承認済み予算を超える支出を認可することは許されていません。","explanation":"neither A nor B では通常、動詞を近い主語 B に一致させます。the chief operating officer は単数なので is。\n重要語句・表現：neither A nor B（AもBも～ない）／authorize expenditures（支出を認可する）／approved budget（承認済み予算）","source":"Q084"},{"id":"FR-03","question":"The new accounting software is designed to be fully (　　　) with the company's existing financial reporting system.","choices":["comparable","compatible","competitive","comprehensive"],"answer":1,"translation":"新しい会計ソフトは、会社の既存の財務報告システムと完全に互換性を持つよう設計されています。","explanation":"be compatible with ～ は「～と互換性がある」。with が手がかりです。\n重要語句・表現：be compatible with ～（～と互換性がある）／existing（既存の）／financial reporting system（財務報告システム）","source":"Q065"},{"id":"FR-04","question":"By the time the external auditors arrive next Friday, the finance department (　　　) all the necessary supporting documents.","choices":["had compiled","has been compiling","was compiling","will have compiled"],"answer":3,"translation":"来週金曜日に外部監査人が到着するまでに、財務部門は必要な裏付け資料をすべてまとめ終えているでしょう。","explanation":"未来の基準時点までの完了なので未来完了 will have compiled。by the time 節では未来のことも現在形 arrive で表します。\n重要語句・表現：external auditors（外部監査人）／compile（まとめる）／supporting documents（裏付け資料）","source":"Q052"},{"id":"FR-05","question":"The manufacturer introduced additional inspection procedures to (　　　) the likelihood of defective products reaching customers.","choices":["facilitate","accommodate","minimize","authorize"],"answer":2,"translation":"製造業者は、不良品が顧客に届く可能性を最小限に抑えるため、追加の検査手順を導入しました。","explanation":"minimize the likelihood of ～ は「～の可能性を最小限にする」。facilitate は促進する、accommodate は対応する、authorize は認可する。\n重要語句・表現：inspection procedures（検査手順）／minimize the likelihood of ～（～の可能性を最小限に抑える）／defective products（不良品）","source":"Q048"},{"id":"FR-06","question":"The annual conference attracted more than 600 participants, many of (　　　) represented multinational corporations.","choices":["whom","which","whose","that"],"answer":0,"translation":"年次会議には600人を超える参加者が集まり、その多くが多国籍企業の代表者でした。","explanation":"many of whom は「そのうちの多くが」。人を指す participants を受け、前置詞 of の後なので whom。\n重要語句・表現：annual conference（年次会議）／many of whom（そのうちの多くが）／multinational corporations（多国籍企業）","source":"Q054"},{"id":"FR-07","question":"The revised employment contract clearly (　　　) the circumstances under which either party may terminate the agreement.","choices":["delegates","delineates","reimburses","complies"],"answer":1,"translation":"改訂された雇用契約書は、いずれかの当事者が契約を終了できる状況を明確に規定しています。","explanation":"delineate は「範囲や条件を明確に示す」。delineates the circumstances が文脈に合います。\n重要語句・表現：employment contract（雇用契約書）／delineate（明確に示す・規定する）／terminate an agreement（契約を終了する）","source":"Q089"},{"id":"FR-08","question":"Had the supplier informed the purchasing department of the delay earlier, alternative shipping arrangements (　　　).","choices":["will be made","can be made","had been making","could have been made"],"answer":3,"translation":"供給業者が遅延をもっと早く購買部門に知らせていれば、代替の輸送手配ができていたかもしれません。","explanation":"Had the supplier informed ～ は If the supplier had informed ～ の倒置。過去の反実仮想で、arrangements は手配「される」ので could have been made。\n重要語句・表現：inform A of B（AにBを知らせる）／purchasing department（購買部門）／alternative shipping arrangements（代替の輸送手配）","source":"Q080"},{"id":"FR-09","question":"The company plans to (　　　) its supplier network to reduce its dependence on a single overseas manufacturer.","choices":["diversify","designate","derive","deduct"],"answer":0,"translation":"会社は、単一の海外メーカーへの依存を減らすため、供給業者のネットワークを多様化する予定です。","explanation":"diversify the supplier network は「調達先を多様化する」。\n重要語句・表現：diversify（多様化する）／supplier network（供給業者のネットワーク）／dependence on ～（～への依存）","source":"Q033"},{"id":"FR-10","question":"The marketing team has proposed several promotional strategies, none of (　　　) would require a substantial increase in the advertising budget.","choices":["whom","whose","which","that"],"answer":2,"translation":"マーケティングチームはいくつかの販促戦略を提案しましたが、どれも広告予算の大幅な増額を必要としません。","explanation":"none of which は「そのどれも～ない」。先行詞 strategies は物で、非制限用法の前置詞 of の後は which。\n重要語句・表現：promotional strategies（販促戦略）／none of which（そのどれも～ない）／advertising budget（広告予算）","source":"Q061"},{"id":"FR-11","question":"The executive director recommended that all confidential documents (　　　) in a secure digital archive.","choices":["are stored","be stored","have stored","were storing"],"answer":1,"translation":"常務取締役は、機密文書をすべて安全なデジタル保管庫に保存するよう勧めました。","explanation":"recommend that S + 動詞の原形。文書は保存される側なので受動態の原形 be stored。\n重要語句・表現：confidential documents（機密文書）／store（保管する）／secure digital archive（安全なデジタル保管庫）","source":"Q056/Q074"},{"id":"FR-12","question":"The proposed expansion is currently under close (　　　) by the company's major investors.","choices":["allocation","incentive","compliance","scrutiny"],"answer":3,"translation":"その事業拡大案は現在、会社の主要投資家による厳しい精査を受けています。","explanation":"under close scrutiny は「厳格な精査・監視の下にある」。\n重要語句・表現：proposed expansion（事業拡大案）／under close scrutiny（厳しい精査を受けて）／major investors（主要投資家）","source":"Q092"},{"id":"FR-13","question":"The contractor must complete the required structural repairs (　　　) the building can receive its final safety certification.","choices":["before","despite","whereas","nevertheless"],"answer":0,"translation":"請負業者は、建物が最終的な安全認証を受ける前に、必要な構造上の修理を完了しなければなりません。","explanation":"before は「～する前に」。後ろに主語と動詞のある節が続きます。\n重要語句・表現：contractor（請負業者）／structural repairs（構造上の修理）／safety certification（安全認証）","source":"Q028"},{"id":"FR-14","question":"The research team conducted additional experiments to (　　　) the findings of the preliminary investigation.","choices":["relinquish","expedite","corroborate","reimburse"],"answer":2,"translation":"研究チームは、予備調査の結果を裏付けるために追加実験を行いました。","explanation":"corroborate findings は「調査結果を証拠によって裏付ける」。\n重要語句・表現：conduct experiments（実験を行う）／corroborate findings（調査結果を裏付ける）／preliminary investigation（予備調査）","source":"Q077"},{"id":"FR-15","question":"Only after the revised project budget had been approved (　　　) the construction company begin ordering additional materials.","choices":["had","did","was","has"],"answer":1,"translation":"改訂されたプロジェクト予算が承認されて初めて、建設会社は追加資材の発注を始めました。","explanation":"Only after ～ が文頭に置かれると主節で倒置が起こります。過去の一般動詞 begin に対し did を使います。\n重要語句・表現：only after ～（～して初めて）／revised project budget（改訂されたプロジェクト予算）／order materials（資材を発注する）","source":"Q079"},{"id":"FR-16","question":"The revised warranty will remain valid (　　　) all maintenance work is performed by authorized technicians.","choices":["whereas","otherwise","despite","provided that"],"answer":3,"translation":"改訂された保証は、すべての保守作業が認定技術者によって行われることを条件に、有効であり続けます。","explanation":"provided that + 節 は「～という条件で」。\n重要語句・表現：warranty（保証）／remain valid（有効であり続ける）／provided that ～（～という条件で）","source":"Q057"},{"id":"FR-17","question":"The audit revealed several significant (　　　) in the company's procedures for processing employee expense claims.","choices":["deficiencies","efficiencies","competencies","contingencies"],"answer":0,"translation":"監査により、従業員の経費精算を処理する会社の手順に、いくつかの重大な不備があることが明らかになりました。","explanation":"deficiencies は「不備・欠陥」。監査で明らかになる問題点という文脈です。\n重要語句・表現：audit（監査）／deficiencies（不備・欠陥）／employee expense claims（従業員の経費精算申請）","source":"Q091"},{"id":"FR-18","question":"The company's investment in automated equipment has reduced production costs, (　　　) improving its ability to compete in overseas markets.","choices":["nevertheless","otherwise","thereby","despite"],"answer":2,"translation":"会社の自動化設備への投資は生産コストを削減し、それによって海外市場での競争力を高めました。","explanation":"thereby + -ing は「それによって～する」。コスト削減の結果を示します。\n重要語句・表現：automated equipment（自動化設備）／production costs（生産費）／thereby doing（それによって～する）","source":"Q062"},{"id":"FR-19","question":"The procurement department is responsible for (　　　) favorable payment terms with the company's major suppliers.","choices":["persuading","negotiating","consulting","reimbursing"],"answer":1,"translation":"調達部門は、主要供給業者と有利な支払い条件を交渉する責任があります。","explanation":"negotiate terms with ～ は「～と条件を交渉する」。be responsible for の後は動名詞です。\n重要語句・表現：procurement department（調達部門）／negotiate favorable payment terms（有利な支払い条件を交渉する）／major suppliers（主要供給業者）","source":"Q037"},{"id":"FR-20","question":"The financial director instructed the accounting team to (　　　) the discrepancies identified during the quarterly audit.","choices":["comply","allocate","convene","reconcile"],"answer":3,"translation":"財務責任者は、四半期監査で特定された不一致を照合・解消するよう経理チームに指示しました。","explanation":"reconcile discrepancies は「不一致を照合して解消する」。\n重要語句・表現：reconcile discrepancies（不一致を照合して解消する）／instruct A to do（Aに～するよう指示する）／quarterly audit（四半期監査）","source":"Q066"},{"id":"FR-21","question":"The company has introduced a new mentoring program to (　　　) cooperation between experienced staff and newly recruited employees.","choices":["foster","impose","retain","restrict"],"answer":0,"translation":"会社は、経験豊富な社員と新入社員の協力を促進するため、新しいメンター制度を導入しました。","explanation":"foster cooperation は「協力を育み促進する」。\n重要語句・表現：mentoring program（助言・指導制度）／foster cooperation（協力を促進する）／newly recruited employees（新たに採用された従業員）","source":"Q085"},{"id":"FR-22","question":"The revised training program, the effectiveness of (　　　) will be assessed through employee feedback, begins next month.","choices":["that","whose","which","what"],"answer":2,"translation":"改訂された研修プログラムは来月始まり、その効果は従業員の意見を通じて評価されます。","explanation":"the effectiveness of which は「その効果」。of の後に関係代名詞 which を置きます。\n重要語句・表現：effectiveness（効果）／assess（評価する）／employee feedback（従業員からの意見）","source":"Q072"},{"id":"FR-23","question":"The project manager requested that several additional cost estimates (　　　) in the final report.","choices":["have included","be included","are including","had included"],"answer":1,"translation":"プロジェクト責任者は、最終報告書に追加の費用見積もりをいくつか含めるよう求めました。","explanation":"request that S + 動詞の原形。見積もりは含まれる側なので be included。\n重要語句・表現：cost estimates（費用の見積もり）／be included in ～（～に含まれる）／final report（最終報告書）","source":"Q074"},{"id":"FR-24","question":"The company's quarterly earnings exceeded market expectations, (　　　) a substantial increase in its share price.","choices":["prompted","to prompt","having been prompted","prompting"],"answer":3,"translation":"会社の四半期利益は市場予想を上回り、その結果株価が大幅に上昇しました。","explanation":"現在分詞 prompting は前の節全体の結果を表します。\n重要語句・表現：quarterly earnings（四半期利益）／exceed expectations（予想を上回る）／prompt an increase（増加を引き起こす）","source":"Q068"},{"id":"FR-25","question":"The investment committee questioned the financial (　　　) of the proposed development because of the rising cost of construction materials.","choices":["viability","visibility","versatility","volatility"],"answer":0,"translation":"投資委員会は、建設資材費の上昇を理由に、開発計画の財務的な実現可能性に疑問を呈しました。","explanation":"financial viability は「財務的な実現可能性・採算性」。\n重要語句・表現：financial viability（財務的な実現可能性・採算性）／proposed development（開発計画）／construction materials（建設資材）","source":"Q059"},{"id":"FR-26","question":"The logistics department is examining shipment records to (　　　) the exact cause of the repeated delivery delays.","choices":["alleviate","accommodate","ascertain","authorize"],"answer":2,"translation":"物流部門は、繰り返される配送遅延の正確な原因を突き止めるため、出荷記録を調べています。","explanation":"ascertain the cause は「原因を突き止める」。\n重要語句・表現：shipment records（出荷記録）／ascertain the cause（原因を突き止める）／repeated delivery delays（繰り返される配送遅延）","source":"Q096"},{"id":"FR-27","question":"Rarely (　　　) the regional offices experienced such a rapid increase in customer inquiries since the company introduced its online support system.","choices":["had","have","did","were"],"answer":1,"translation":"会社がオンラインサポートシステムを導入して以来、地域事務所で顧客からの問い合わせがこれほど急増したことはめったにありません。","explanation":"Rarely が文頭にあるので倒置。since + 過去の出来事が現在までの期間を表すため、現在完了 have the regional offices experienced。\n重要語句・表現：rarely（めったに～ない）／customer inquiries（顧客からの問い合わせ）／online support system（オンラインサポートシステム）","source":"Q099"},{"id":"FR-28","question":"(　　　) the potential financial implications of the merger, the board requested an independent assessment before proceeding.","choices":["Recognized","To be recognized","Having been recognized","Recognizing"],"answer":3,"translation":"合併による財務上の潜在的な影響を認識した取締役会は、先に進む前に独立した評価を求めました。","explanation":"Recognizing は能動の分詞構文。主語 the board が影響を「認識する」関係です。\n重要語句・表現：recognize（認識する）／financial implications（財務上の影響）／independent assessment（独立した評価）","source":"Q073"},{"id":"FR-29","question":"The legal department advised the management team to review all outstanding financial (　　　) before finalizing the acquisition agreement.","choices":["liabilities","incentives","credentials","concessions"],"answer":0,"translation":"法務部門は、買収契約を最終決定する前に、未処理の財務上の負債・責任をすべて確認するよう経営陣に助言しました。","explanation":"financial liabilities は「財務上の負債・責任」。outstanding は「未処理の」。\n重要語句・表現：outstanding financial liabilities（未処理の財務上の負債・責任）／legal department（法務部門）／acquisition agreement（買収契約）","source":"Q098"},{"id":"FR-30","question":"The company has developed a comprehensive contingency plan to (　　　) essential business operations during unexpected system failures.","choices":["stipulate","substantiate","sustain","reconcile"],"answer":2,"translation":"会社は、予期せぬシステム障害の際にも重要な事業活動を維持するため、包括的な緊急対応計画を策定しました。","explanation":"sustain operations は「業務を維持する」。contingency plan は不測の事態に備えた計画です。\n重要語句・表現：contingency plan（不測の事態への対応計画）／sustain business operations（事業活動を維持する）／unexpected system failures（予期せぬシステム障害）","source":"Q100"}];let picks=Array(questions.length).fill(null),graded=false,started=false,deadline=0,clock=null;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded||!started;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 30 回答済み';document.getElementById('grade').disabled=graded||!started||picks.some(x=>x===null)}
function finish(timedOut=false){if(graded||!started)return;graded=true;clearInterval(clock);const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 30 問正解（'+(n/questions.length*100).toFixed(1)+'%）'+(timedOut?'（時間切れ・未回答は不正解）':'');document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').classList.add('visible');document.getElementById('resetTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})}function tick(){const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent='残り時間 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finish(true)}document.getElementById('grade').addEventListener('click',()=>finish(false));document.getElementById('reset').addEventListener('click',()=>{clearInterval(clock);picks.fill(null);graded=false;started=false;startButton.disabled=false;startButton.textContent='Start Test';document.getElementById('startPanel').classList.remove('hidden-start');document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').classList.remove('visible');document.getElementById('resetTop').hidden=true;document.getElementById('timer').textContent='残り時間 10:00';render();window.scrollTo({top:0,behavior:'smooth'})});const startButton=document.getElementById('startButton');document.getElementById('resetTop').addEventListener('click',()=>document.getElementById('reset').click());startButton.addEventListener('click',()=>{if(started)return;started=true;deadline=Date.now()+600000;clock=setInterval(tick,250);startButton.disabled=true;startButton.textContent='In Progress';document.getElementById('startPanel').classList.add('hidden-start');render()});render();
</script></body></html>
