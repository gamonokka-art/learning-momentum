<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Review 02</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}

.start-panel{background:#fff;border:2px solid #12669b;border-radius:14px;padding:22px 24px;margin:16px 0 20px;text-align:center;box-shadow:0 4px 16px #112b4810}
.start-panel p{margin:0 0 12px;line-height:1.65;color:#22354f}
.start-panel p:first-child{font-size:20px}
.start-panel .btn{font-size:18px;padding:13px 28px;margin-top:5px;cursor:pointer}
.hidden-start{display:none}
.meta{position:sticky;top:0;z-index:10;background:#f2f5f9;padding:12px 6px;border-bottom:1px solid #dce4ee}
#timer{font-weight:750;color:#125c94}

.meta{display:block}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#scoreTop{display:none;margin-top:9px;padding:10px 12px;border-radius:9px;background:#e8f2fb;color:#123f66;font-size:16px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
#scoreTop.visible{display:block}
#score{font-variant-numeric:tabular-nums}
@media(max-width:550px){.meta-top{font-size:12px;gap:6px}.meta-top .instructions{display:none}#scoreTop{font-size:15px;padding:8px}}

.score-actions{display:flex;align-items:center;gap:8px}.score-actions #scoreTop{flex:1;text-align:left}.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.top-actions:has(button[hidden]){display:none}
.top-actions .btn{padding:8px 14px;font-size:13px;min-height:38px}
button[hidden]{display:none!important}
@media(max-width:550px){.meta{padding:9px 8px;margin-bottom:12px}.meta-top{display:grid;grid-template-columns:1fr auto}.meta-top #progress{text-align:right}.top-actions .btn{padding:8px 13px}#scoreTop{font-size:13px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">30 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Review 02 / 05</span></div><p class="subtitle">Grammar &amp; Vocabulary Review ②</p><p class="details">制限時間10分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="https://gamonokka-art.github.io/learning-momentum/advanced/" style="color:#12669b;font-weight:650;text-decoration:none">← Advancedの目次へ</a></nav><div id="startPanel" class="start-panel"><p><strong>30問・制限時間10分</strong></p><p>準備ができたら「Start Test」を押してください。開始後に選択肢が有効になり、タイマーが動きます。</p><button class="btn" id="startButton" type="button">Start Test</button></div><div class="meta"><div class="meta-top"><span id="timer" role="timer">残り時間 10:00</span><span class="instructions">全30問・各問1つ選択してください</span><span id="progress">0 / 30 回答済み</span></div><div class="score-actions"><div id="scoreTop" role="status" aria-live="polite"></div><div id="topActions" class="top-actions"><button class="btn secondary" id="resetTop" type="button" hidden>Try Again</button></div></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset" type="button">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id": "R02-01", "question": "The renewal of the distribution agreement is contingent (　　　) the supplier's ability to meet the revised delivery standards.", "choices": ["at", "for", "on", "with"], "answer": 2, "translation": "販売契約の更新は、供給業者が改訂された納品基準を満たせるかどうかにかかっています。", "explanation": "be contingent on ～ は「～を条件とする」という定型表現です。on が必要です。", "source": "Q026"}, {"id": "R02-02", "question": "To reduce supply-chain risks, the manufacturer plans to (　　　) its sources of raw materials across several countries.", "choices": ["diversify", "designate", "distribute", "distinguish"], "answer": 0, "translation": "サプライチェーンのリスクを減らすため、製造業者は原材料の調達先を複数の国に分散させる計画です。", "explanation": "diversify は「多様化する」。調達先を複数国に広げる目的に合います。designate＝指定する、distribute＝配分する、distinguish＝区別する。", "source": "Q033"}, {"id": "R02-03", "question": "(　　　) considerable opposition from several department heads, the restructuring proposal was approved by the board.", "choices": ["Although", "Despite", "Nevertheless", "Whereas"], "answer": 1, "translation": "複数の部門長から相当な反対があったにもかかわらず、組織再編案は取締役会で承認されました。", "explanation": "Despite は前置詞で、後ろに名詞句 considerable opposition が続きます。Although／Whereas は節を導きます。", "source": "Q029"}, {"id": "R02-04", "question": "The airline agreed to (　　　) the additional accommodation expenses incurred by passengers whose flights were canceled.", "choices": ["allocate", "impose", "absorb", "negotiate"], "answer": 2, "translation": "航空会社は、欠航した便の乗客に生じた追加の宿泊費を負担することに同意しました。", "explanation": "absorb expenses / costs は「費用を負担する・吸収する」。allocate＝配分する、impose＝課す、negotiate＝交渉する。", "source": "Q031"}, {"id": "R02-05", "question": "By the time the new distribution center opens in December, the company (　　　) all the necessary equipment.", "choices": ["installs", "had installed", "has installed", "will have installed"], "answer": 3, "translation": "12月に新しい配送センターが開設される頃までには、同社は必要な設備をすべて設置し終えているでしょう。", "explanation": "未来のある時点までに完了するので未来完了形 will have installed。時を表す節は opens と現在形です。", "source": "Q035"}, {"id": "R02-06", "question": "The company operates several research laboratories, each of (　　　) focuses on a different area of renewable energy.", "choices": ["whose", "whom", "which", "that"], "answer": 2, "translation": "同社はいくつかの研究所を運営しており、それぞれが再生可能エネルギーの異なる分野を研究しています。", "explanation": "each of which は「そのそれぞれが」。先行詞 laboratories は物なので which を使います。", "source": "Q036"}, {"id": "R02-07", "question": "The revised budget includes additional funding for employee training, the benefits of (　　　) are expected to become apparent over the next year.", "choices": ["which", "whom", "whose", "that"], "answer": 0, "translation": "改訂予算には従業員研修の追加資金が含まれており、その効果は今後1年間で明らかになると見込まれています。", "explanation": "the benefits of which は「その効果」。前置詞 of の直後には関係代名詞 that を置けません。", "source": "Q036・Q039（関係詞の応用）"}, {"id": "R02-08", "question": "The finance director recommended that each department (　　　) its projected expenses before the annual budget meeting.", "choices": ["revises", "revise", "revised", "has revised"], "answer": 1, "translation": "財務部長は、年次予算会議の前に各部門が予想経費を見直すよう勧めました。", "explanation": "recommend that S + 動詞の原形。each department が単数でも revise のままです。", "source": "Q041"}, {"id": "R02-09", "question": "The construction company must obtain official (　　　) before beginning work on the proposed extension.", "choices": ["allowance", "admission", "approval", "allocation"], "answer": 2, "translation": "その建設会社は、計画中の増築工事を始める前に正式な承認を得なければなりません。", "explanation": "obtain official approval は「正式な承認を得る」。ほかは手当・入場・配分などを表します。", "source": "Q044"}, {"id": "R02-10", "question": "The accounting team prepared a detailed (　　　) of operating expenses by department and project.", "choices": ["breakdown", "breakthrough", "drawback", "turnover"], "answer": 0, "translation": "経理チームは、部門別・プロジェクト別の営業経費の詳細な内訳を作成しました。", "explanation": "a detailed breakdown of ～ は「～の詳細な内訳」。breakthrough＝突破口、drawback＝欠点、turnover＝売上高・離職率など。", "source": "Q050"}, {"id": "R02-11", "question": "The new safety guidelines will be implemented (　　　) all manufacturing sites beginning next month.", "choices": ["throughout", "toward", "beneath", "beside"], "answer": 0, "translation": "新しい安全指針は来月からすべての製造拠点で実施されます。", "explanation": "throughout は「～の至る所で」。全拠点に適用されることを表します。", "source": "Q027（implement の応用）"}, {"id": "R02-12", "question": "The marketing team is responsible for (　　　) the effectiveness of the company's latest advertising campaign.", "choices": ["evaluate", "evaluated", "evaluating", "evaluation"], "answer": 2, "translation": "マーケティングチームは、最新の広告キャンペーンの効果を評価する責任があります。", "explanation": "be responsible for の for は前置詞。動詞を続けるときは動名詞 evaluating を使います。", "source": "Q037（前置詞＋動名詞の応用）"}, {"id": "R02-13", "question": "The proposed merger is expected to (　　　) the company's position in the international market.", "choices": ["strengthen", "strength", "strongly", "strengthened"], "answer": 0, "translation": "提案されている合併は、国際市場における同社の立場を強化すると見込まれています。", "explanation": "be expected to の後は動詞の原形。strengthen は「強化する」です。", "source": "Q032（事業拡大の関連語彙）"}, {"id": "R02-14", "question": "The board of directors has decided to postpone the expansion project (　　　) economic conditions become more favorable.", "choices": ["during", "until", "within", "throughout"], "answer": 1, "translation": "取締役会は経済状況がさらに好転するまで拡張計画を延期することにしました。", "explanation": "until + 節 は「～するまで」。during / within / throughout は通常、後ろに名詞句を取ります。", "source": "Q040"}, {"id": "R02-15", "question": "The revised employee handbook contains (　　　) instructions for reporting workplace safety concerns.", "choices": ["specify", "specification", "specifically", "specific"], "answer": 3, "translation": "改訂された従業員ハンドブックには、職場の安全上の懸念を報告するための具体的な指示が記載されています。", "explanation": "名詞 instructions を修飾する形容詞 specific が必要です。", "source": "Q045（形容詞選択の応用）"}, {"id": "R02-16", "question": "The consultant provided a number of recommendations, (　　　) were subsequently incorporated into the company's strategic plan.", "choices": ["much of which", "several of which", "each of whom", "whose"], "answer": 1, "translation": "コンサルタントはいくつもの提案を示し、そのうちのいくつかは後に会社の戦略計画に取り入れられました。", "explanation": "several of which は「そのうちのいくつか」。recommendations は物・複数です。", "source": "Q036・Q039（関係詞の応用）"}, {"id": "R02-17", "question": "The new software system allows employees to access customer information more (　　　) than the previous platform.", "choices": ["efficiency", "efficient", "efficiently", "efficiencies"], "answer": 2, "translation": "新しいソフトウェアシステムでは、従業員は従来のプラットフォームより効率的に顧客情報にアクセスできます。", "explanation": "動詞 access を修飾する副詞 efficiently が必要です。more efficiently than ～ は比較表現です。", "source": "Q050（品詞の応用・直接対応なし）"}, {"id": "R02-18", "question": "The manufacturer has agreed to replace any components (　　　) to be defective during the final inspection.", "choices": ["finding", "found", "find", "finds"], "answer": 1, "translation": "製造業者は、最終検査で欠陥があると判明した部品を交換することに同意しました。", "explanation": "components found to be defective は「欠陥があると判明した部品」。過去分詞 found が後ろから名詞を修飾します。", "source": "Q046（分詞による後置修飾の応用）"}, {"id": "R02-19", "question": "The company is seeking an experienced consultant who can (　　　) the transition to a cloud-based accounting system.", "choices": ["facilitate", "fluctuate", "formulate", "forecast"], "answer": 0, "translation": "同社はクラウド型会計システムへの移行を円滑に進められる経験豊富なコンサルタントを探しています。", "explanation": "facilitate は「促進する・円滑にする」。facilitate the transition は自然な表現です。", "source": "Q027（業務改善関連語彙・直接対応なし）"}, {"id": "R02-20", "question": "The supplier will begin preparing the equipment for shipment immediately (　　　) the revised contract has been signed.", "choices": ["during", "after", "despite", "whereas"], "answer": 1, "translation": "改訂契約が締結された後、供給業者は直ちに出荷に向けた機器の準備を始めます。", "explanation": "after + 節 は「～した後で」。during / despite は前置詞、whereas は対比を示す接続詞です。", "source": "Q047"}, {"id": "R02-21", "question": "The financial report must be submitted to the auditing committee (　　　) the end of the fiscal year.", "choices": ["by", "during", "among", "across"], "answer": 0, "translation": "財務報告書は会計年度末までに監査委員会に提出しなければなりません。", "explanation": "by は期限を表し「～までに」。during は期間中、among は～の間で、across は～を横切って。", "source": "Q028（期限・時間関係の応用）"}, {"id": "R02-22", "question": "The research team has collected (　　　) data to support its conclusions regarding consumer preferences.", "choices": ["substance", "substantially", "substantial", "substantiate"], "answer": 2, "translation": "研究チームは、消費者の好みに関する結論を裏付けるために相当量のデータを収集しました。", "explanation": "data を修飾する形容詞 substantial（相当量の）が必要です。", "source": "Q045（形容詞の応用）"}, {"id": "R02-23", "question": "The company introduced flexible working arrangements to improve employee (　　　) and reduce staff turnover.", "choices": ["satisfy", "satisfactory", "satisfaction", "satisfactorily"], "answer": 2, "translation": "同社は従業員満足度を高め、離職率を下げるために柔軟な勤務制度を導入しました。", "explanation": "employee satisfaction は「従業員満足度」。improve の目的語となる名詞が必要です。", "source": "Q050（名詞選択の応用）"}, {"id": "R02-24", "question": "The regional director requested that all branch managers (　　　) their quarterly sales forecasts by Friday.", "choices": ["submit", "submits", "submitted", "submitting"], "answer": 0, "translation": "地域統括責任者は、すべての支店長に金曜日までに四半期売上予測を提出するよう求めました。", "explanation": "request that S + 動詞の原形。主語が複数でも単数でも原形 submit を使います。", "source": "Q041"}, {"id": "R02-25", "question": "The proposed changes to the distribution network are intended to (　　　) unnecessary transportation costs.", "choices": ["eliminate", "establish", "elaborate", "encounter"], "answer": 0, "translation": "物流網の変更案は、不要な輸送費をなくすことを目的としています。", "explanation": "eliminate unnecessary costs は「不要な費用を削減・解消する」。ほかの動詞は文脈に合いません。", "source": "Q048（リスク・費用削減の関連語彙）"}, {"id": "R02-26", "question": "The new training materials are designed to be easily (　　　) to employees with different levels of technical expertise.", "choices": ["access", "accessing", "accessible", "accessibility"], "answer": 2, "translation": "新しい研修教材は、技術的な知識の程度が異なる従業員にも容易に利用できるよう設計されています。", "explanation": "be accessible to ～ は「～が利用できる」。be の後に形容詞 accessible が必要です。", "source": "Q045（形容詞選択の応用）"}, {"id": "R02-27", "question": "The company's overseas operations have expanded (　　　) over the past three years, particularly in Southeast Asia.", "choices": ["considerable", "considerably", "consideration", "consider"], "answer": 1, "translation": "同社の海外事業は過去3年間で、特に東南アジアにおいて大幅に拡大しました。", "explanation": "動詞 expanded を修飾する副詞 considerably（かなり・大幅に）が必要です。", "source": "Q032（expand の応用）"}, {"id": "R02-28", "question": "The equipment supplier agreed to provide replacement parts at no additional charge, (　　　) the machines remain under warranty.", "choices": ["provided that", "in spite of", "regardless of", "due to"], "answer": 0, "translation": "機器の供給業者は、機械が保証期間内であることを条件に、追加料金なしで交換部品を提供することに同意しました。", "explanation": "provided that + 節 は「～という条件で」。残りの選択肢は前置詞句で、後ろに節を直接取れません。", "source": "Q026（条件表現の応用）"}, {"id": "R02-29", "question": "The project manager emphasized the importance of maintaining accurate records (　　　) the entire construction process.", "choices": ["throughout", "between", "against", "beneath"], "answer": 0, "translation": "プロジェクト責任者は、建設工程全体を通して正確な記録を維持する重要性を強調しました。", "explanation": "throughout the entire process は「工程全体を通して」。期間全体を表します。", "source": "Q040（期間表現の応用）"}, {"id": "R02-30", "question": "The cybersecurity team will conduct a comprehensive review to identify potential (　　　) in the company's data protection systems.", "choices": ["vulnerabilities", "qualifications", "conveniences", "reimbursements"], "answer": 0, "translation": "サイバーセキュリティチームは、同社のデータ保護システムに潜む脆弱性を特定するため、包括的な調査を実施します。", "explanation": "potential vulnerabilities は「潜在的な脆弱性」。qualifications＝資格、conveniences＝利便性、reimbursements＝払い戻しです。", "source": "Q048・Q049（リスク・情報保護の関連テーマ／新出語彙）"}];let picks=Array(questions.length).fill(null),graded=false,started=false,deadline=0,clock=null;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded||!started;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 30 回答済み';document.getElementById('grade').disabled=graded||!started||picks.some(x=>x===null)}
function finish(timedOut=false){if(graded||!started)return;graded=true;clearInterval(clock);const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 30 問正解（'+(n/questions.length*100).toFixed(1)+'%）'+(timedOut?'（時間切れ・未回答は不正解）':'');document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').classList.add('visible');document.getElementById('resetTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})}function tick(){const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent='残り時間 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finish(true)}document.getElementById('grade').addEventListener('click',()=>finish(false));document.getElementById('reset').addEventListener('click',()=>{clearInterval(clock);picks.fill(null);graded=false;started=false;startButton.disabled=false;startButton.textContent='Start Test';document.getElementById('startPanel').classList.remove('hidden-start');document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').classList.remove('visible');document.getElementById('resetTop').hidden=true;document.getElementById('timer').textContent='残り時間 10:00';render();window.scrollTo({top:0,behavior:'smooth'})});const startButton=document.getElementById('startButton');document.getElementById('resetTop').addEventListener('click',()=>document.getElementById('reset').click());startButton.addEventListener('click',()=>{if(started)return;started=true;deadline=Date.now()+600000;clock=setInterval(tick,250);startButton.disabled=true;startButton.textContent='In Progress';document.getElementById('startPanel').classList.add('hidden-start');render()});render();
</script></body></html>
