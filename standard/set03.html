<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 03</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 03 / 20</div><h1>Business English Standard</h1><div>Verb Tenses ①｜動詞の時制</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[
{id:"Q011",q:"The accounting department (　　　) the quarterly financial report yesterday afternoon.",o:["completes", "has completed", "completed", "will complete"],a:2,j:"経理部は昨日の午後、四半期財務報告書を完成させました。",e:"yesterday afternoon は過去の特定の時点を示すため、過去形 completed が正解です。現在完了形 has completed は、通常 yesterday のような明確な過去時点とは一緒に使いません。",v:"accounting department（経理部）／quarterly financial report（四半期財務報告書）"},
{id:"Q012",q:"Ms. Rivera (　　　) for the logistics company since 2018 and continues to work there today.",o:["works", "has worked", "had worked", "was working"],a:1,j:"リベラさんは2018年からその物流会社で働いており、現在も勤務を続けています。",e:"since 2018 は過去のある時点から現在までの継続を表します。continues to work there today からも現在まで勤務が続いていることがわかるため、現在完了形 has worked が正解です。",v:"since 2018（2018年からずっと）／logistics company（物流会社）"},
{id:"Q013",q:"By the time the maintenance crew arrived, the building supervisor (　　　) the source of the water leak.",o:["identifies", "has identified", "will identify", "had identified"],a:3,j:"保守作業員が到着するまでに、建物の管理責任者は水漏れの原因箇所を特定していました。",e:"作業員が到着したという過去の時点よりも前に、原因箇所の特定が完了していたことを表すため、過去完了形 had identified が正解です。by the time + 過去形 は、過去の基準時点を示す手がかりです。",v:"by the time ～（～する時までに）／identify the source of a leak（水漏れの原因箇所を特定する）"},
{id:"Q014",q:"According to the airline's newly released schedule, it (　　　) a direct flight between the two cities next spring.",o:["launched", "has launched", "will launch", "had launched"],a:2,j:"航空会社が新たに発表した運航予定によると、来春、その2都市間の直行便を就航させる予定です。",e:"next spring は未来の時点を示しています。選択肢の中で未来の予定を表せる will launch が正解です。過去形 launched、現在完了形 has launched、過去完了形 had launched は未来の就航予定と一致しません。",v:"according to ～（～によると）／launch a direct flight（直行便を就航させる）"},
{id:"Q015",q:"While the technician (　　　) the printer yesterday afternoon, the office staff continued working in another room.",o:["was repairing", "has repaired", "will repair", "repairs"],a:0,j:"昨日の午後、技術者がプリンターを修理している間、事務スタッフは別の部屋で仕事を続けていました。",e:"yesterday afternoon と continued から、過去の出来事だとわかります。while は一定時間続く動作を表すことが多く、この文では過去進行形 was repairing が適切です。",v:"while ～（～している間）／continue working（仕事を続ける）"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！主語の見極めができています。':'解説を確認して、主語の中心となる語を見つけましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
