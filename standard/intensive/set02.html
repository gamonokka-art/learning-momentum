<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standard Intensive Practice Set 02 | Learning Momentum</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#1b2940;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#112b48;color:white;padding:30px max(20px,calc((100vw - 800px)/2))}header small{color:#c6d9ed;letter-spacing:.06em;font-weight:700}h1{margin:10px 0;font-size:clamp(24px,4vw,32px)}header p{color:#dce7f2;margin:7px 0}main{max-width:820px;margin:auto;padding:24px 16px 55px}a{color:#12669b}.q{background:#fff;border:1px solid #dce4ee;border-radius:13px;padding:20px;margin:14px 0}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.7;font-weight:600}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center}.opt:has(input:checked){background:#e9f4ff;border-color:#146ba5}input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:15px;padding-top:12px;line-height:1.7}.correct{color:#14754b}.wrong{color:#af3f34}.btn{border:0;border-radius:9px;padding:12px 20px;background:#12669b;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}#score{font-size:21px;font-weight:700}footer{text-align:center;color:#607188;padding:18px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:16px}.sentence{font-size:16px}}</style></head><body><header><small>LEARNING MOMENTUM</small><h1>Standard Intensive Practice</h1><p>Set 02｜標準〜やや難｜30問・解答目安15分</p></header><main><p><a href="index.html">← 集中演習の目次へ</a></p><p>全30問に回答すると採点できます。採点後に正解・日本語訳・解説を表示します。</p><p id="progress" aria-live="polite">0 / 30 回答済み</p><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>const questions=[["The manufacturer has decided to postpone the introduction of the new product because the production process remains (　　　) costly.","excessively|excessive|excess|exceed",0,"製造工程の費用が依然として過度に高いため、メーカーは新製品の導入を延期することにしました。","costlyは-lyで終わる形容詞。副詞excessivelyが修飾します。"],["The company recently hired a financial analyst (　　　) recommendations have helped improve its investment strategy.","whom|which|who|whose",3,"会社は提案によって投資戦略の改善に貢献した財務アナリストを最近採用しました。","whose＋名詞で所有格の関係代名詞。"],["After reviewing the results of the pilot program, the management team determined (　　　) the new scheduling system across all departments.","implementing|to implement|implement|implemented",1,"試験導入の結果を確認した後、経営陣は新しい勤務管理システムを全社導入することに決めました。","determine to doで「～することを決意する」。"],["The board of directors requested a detailed (　　　) of the financial risks associated with the proposed acquisition.","assess|assessing|assessment|assessed",2,"取締役会は買収案に伴う財務リスクの詳細な評価を求めました。","a detailed assessment ofで「～の詳細な評価」。"],["Employees must attend one training session but may choose (　　　) of the two available sessions, as both cover the same material.","either|neither|every|all",0,"従業員は研修を1回受ける必要がありますが、内容が同じなので2回のうちどちらを選んでも構いません。","either of the twoで「2つのうちどちらか一方」。"],["The purchasing department is evaluating several proposals to determine which supplier can provide the most (　　　) priced equipment.","competition|compete|competitive|competitively",3,"購買部門はどの業者が最も競争力のある価格で設備を提供できるか評価しています。","competitively pricedで「競争力のある価格が付けられた」。"],["(　　　) the revised contract carefully, the legal team recommended several changes before signing it.","Examined|Having examined|Having been examined|Examination",1,"法務チームは修正契約書を慎重に確認した後、署名前にいくつかの変更を提案しました。","Having examinedは先行する動作を表す完了の分詞構文。"],["During the staff meeting, the director took time to (　　　) employees' concerns about the upcoming organizational changes.","deliver|transfer|address|assign",2,"会議中、部長は今後の組織変更に対する従業員の懸念に対応する時間を取りました。","address concernsで「懸念に対処する」。"],["The company's latest financial report indicates that operating costs have remained relatively (　　　) despite fluctuations in raw material prices.","stable|stably|stability|stabilize",0,"最新の財務報告によると原材料価格の変動にもかかわらず運営費は比較的安定しています。","remain＋形容詞stable。relativelyはstableを修飾します。"],["The annual conference provides an opportunity for employees to share ideas with colleagues (　　　) they rarely meet in person.","whose|which|where|whom",3,"年次会議は普段直接会う機会の少ない同僚と意見を交換する機会になります。","人を先行詞とする目的格関係代名詞whom。"],["Employees who enjoy (　　　) with customers from different countries are encouraged to apply for positions in the international sales department.","to interact|interacting|interact|interacted",1,"さまざまな国の顧客との交流を楽しむ従業員には国際営業部への応募が勧められます。","enjoyの目的語には動名詞interactingを使います。"],["The company has introduced a (　　　) improvement program to monitor product quality throughout the manufacturing process.","continuity|continuously|continuous|continue",2,"会社は製造工程全体の品質を監視する継続的改善プログラムを導入しました。","continuous improvementは「継続的改善」。"],["The company has introduced several cost-saving measures, some of (　　　) have already produced positive results.","which|them|that|those",0,"会社はいくつかの経費削減策を導入し、そのうちの一部はすでに成果を上げています。","カンマに続くsome of whichは非制限用法の関係詞表現。"],["Of all the proposals submitted, the revised marketing plan was by far the (　　　) effective.","much|many|more|most",3,"提出されたすべての提案の中で、修正版の販売計画が断然最も効果的でした。","by far the most effectiveで最上級を強調します。"],["The marketing team has developed a (　　　) effective strategy for reaching customers in overseas markets.","height|highly|higher|high",1,"マーケティングチームは海外顧客に届く非常に効果的な戦略を開発しました。","highlyは形容詞effectiveを修飾する副詞。"],["The company has introduced a new procedure under (　　　) all purchase requests must be approved by a department manager.","that|where|which|what",2,"会社はすべての購買申請に部門責任者の承認が必要となる新手続きを導入しました。","under whichは前置詞＋関係代名詞。"],["The accounting department is reviewing all expenses (　　　) with the relocation of the company's headquarters.","associated|association|associate|associating",0,"経理部は本社移転に関連するすべての経費を確認しています。","associated withは過去分詞による後置修飾。"],["Although several suppliers submitted proposals, only a few of (　　　) met all the company's requirements.","themselves|their|they|them",3,"複数の業者が提案書を提出しましたが、すべての条件を満たしたのは少数でした。","a few of themのようにofの後には目的格。"],["The operations manager explained that the new system was still being (　　　) before its official launch.","testing|tested|test|tests",1,"運営責任者は新システムが正式導入前にまだ試験中であると説明しました。","was being testedは過去進行形の受動態。"],["All regional sales managers are required to (　　　) directly to the vice president of sales.","submit|correspond|report|consult",2,"すべての地域営業責任者は営業担当副社長の直属となります。","report directly toで「～の直属である」。"],["The training department has developed an online course (　　　) employees can access whenever they need additional guidance.","that|where|whose|whom",0,"研修部は従業員が必要に応じて利用できるオンライン講座を開発しました。","accessの目的語となる関係代名詞that。"],["The company's employee training program is all the (　　　) for the feedback received from experienced staff members.","best|well|good|better",3,"その会社の社員研修プログラムは経験豊富なスタッフからの意見によってさらに良いものになっています。","all the better forで「～のおかげでいっそう良い」。"],["The company's customer satisfaction survey revealed a significant (　　　) between delivery speed and overall customer satisfaction.","relative|relation|relatively|relate",1,"顧客満足度調査により配送速度と全体的な満足度の間に重要な関係があることが分かりました。","a significant relation between A and Bで「AとBの重要な関係」。"],["(　　　) by the unexpected increase in demand, the manufacturer decided to expand its production capacity.","Encouraging|Encouraged|Encouragement|Encourage",1,"予想外の需要増に後押しされ、メーカーは生産能力の拡大を決定しました。","Encouraged byは受動の分詞構文。"],["The company has established a new (　　　) management system to improve the accuracy of its financial reporting.","risky|riskily|risk|risked",2,"会社は財務報告の正確性を高めるため新たなリスク管理システムを設置しました。","risk managementは名詞＋名詞の複合名詞。"],["The human resources department reminded employees that they should keep (　　　) informed of any changes to their emergency contact information.","it|itself|its|theirs",0,"人事部は緊急連絡先の変更があれば同部門に知らせるよう従業員に注意しました。","keep it informedのitは人事部を指します。"],["The revised training materials contain a (　　　) comprehensive explanation of the company's updated safety procedures.","remark|remarkable|remarked|remarkably",3,"改訂された研修資料には更新された安全手順について驚くほど包括的な説明があります。","remarkablyは形容詞comprehensiveを修飾。"],["(　　　) all the necessary documents in advance, applicants can complete the registration process more quickly.","Prepared|Preparing|Preparation|Having been prepared",1,"必要な書類を事前に用意することで応募者は登録手続きをより速く済ませられます。","Preparingで能動の分詞構文。"],["The new employee orientation program includes a (　　　) designed training module for staff members who work remotely.","special|specialty|specially|specialize",2,"新入社員研修には在宅勤務者向けに特別に設計された研修モジュールが含まれます。","specially designedで「特別に設計された」。"],["The customer service department has received (　　　) more inquiries than expected following the announcement of the new service.","considerably|considerable|consideration|consider",0,"新サービスの発表後、顧客サービス部には予想よりかなり多くの問い合わせが届きました。","considerably moreで「かなり多くの」。"]];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');function progress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / '+questions.length+' 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}function render(){root.innerHTML='';questions.forEach((q,i)=>{let section=document.createElement('section');section.className='q';let h=document.createElement('h2');h.textContent='Q'+String(i+1).padStart(2,'0');section.append(h);let s=document.createElement('p');s.className='sentence';s.textContent=q[0];section.append(s);let opts=document.createElement('div');opts.className='opts';q[1].split('|').forEach((choice,k)=>{let label=document.createElement('label');label.className='opt';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;progress()});label.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+choice));opts.append(label)});section.append(opts);if(graded){let r=document.createElement('div');r.className='result';let p=document.createElement('p');p.className=picks[i]===q[2]?'correct':'wrong';p.textContent=(picks[i]===q[2]?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q[2])+') '+q[1].split('|')[q[2]];r.append(p);let t=document.createElement('p');t.textContent='日本語訳：'+q[3];r.append(t);let e=document.createElement('p');e.textContent='解説：'+q[4];r.append(e);section.append(r)}root.append(section)});progress()}document.getElementById('grade').addEventListener('click',()=>{graded=true;let n=picks.filter((x,i)=>x===questions[i][2]).length;document.getElementById('score').textContent='結果：'+n+' / '+questions.length+' 問正解';render();document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});document.getElementById('reset').addEventListener('click',()=>{picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})});render();</script></body></html>
