<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 12</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 12 / 20</div><h1>Business English Standard</h1><div>Infinitives & Gerunds ①｜不定詞・動名詞</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[{"id": "Q056", "q": "(　　　) accurate records of customer transactions is essential for preparing monthly financial reports.", "o": ["Maintain", "Maintaining", "Maintained", "To maintaining"], "a": 1, "j": "顧客取引の正確な記録を維持することは、月次財務報告書の作成に不可欠です。", "e": "文の主語には動名詞句 Maintaining ... を置けます。To maintaining は不適切です。", "v": "maintain records／financial reports"}, {"id": "Q057", "q": "The marketing team's main objective is (　　　) customer awareness of the company's new subscription service.", "o": ["increase", "increases", "to increase", "increased"], "a": 2, "j": "マーケティングチームの主な目標は、新しい定額サービスの認知度を高めることです。", "e": "主語 The marketing team's main objective（マーケティングチームの主な目標）に続く is の補語として、不定詞 to increase（高めること）が適切です。increase は原形動詞、increases は三人称単数現在形の動詞で、いずれもこの位置には置けません。increased もここでは不適切です。", "v": "main objective／customer awareness"}, {"id": "Q058", "q": "The facilities manager postponed (　　　) the ventilation system until the replacement parts arrived.", "o": ["inspect", "inspecting", "inspected", "to inspect"], "a": 1, "j": "施設管理者は交換部品が届くまで換気設備の点検を延期しました。", "e": "postpone の目的語には動名詞を用います。postpone inspecting が正しい形です。", "v": "postpone doing／replacement parts"}, {"id": "Q059", "q": "The accounting department is responsible for ensuring that all expense reports are submitted on time. Employees should avoid (　　　) incomplete forms.", "o": ["submit", "submitted", "to submit", "submitting"], "a": 3, "j": "経理部は経費報告書が期限内に提出されるよう管理しています。従業員は不備のある書類の提出を避けるべきです。", "e": "avoid の後ろには動名詞を置きます。avoid submitting が正解です。", "v": "avoid doing／incomplete forms"}, {"id": "Q060", "q": "The updated instructions make it easier for new employees (　　　) the online registration process without assistance.", "o": ["complete", "completing", "completed", "to complete"], "a": 3, "j": "改訂された説明書によって、新入社員は手助けなしでオンライン登録を完了しやすくなります。", "e": "make it + 形容詞 + for 人 + to do の構文です。", "v": "without assistance／registration process"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！よく理解できています。':'解説を確認して、解説を確認して復習しましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
