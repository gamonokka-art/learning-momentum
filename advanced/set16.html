<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Set 16</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.meta-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.btn.small{padding:8px 12px;font-size:13px;border-radius:8px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}
.set-nav{margin:0 0 18px}.set-nav-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.set-nav a{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:750;border-radius:9px;min-height:44px;padding:10px 12px;border:1px solid #c9d7e6;background:#fff;color:#24557e}.set-nav a:hover,.set-nav a:focus-visible{background:#e6f0fa}.set-nav a.primary-next{background:#12669b;border-color:#12669b;color:white;font-size:16px;min-height:48px}.set-nav a.primary-next:hover,.set-nav a.primary-next:focus-visible{background:#0d4d78}.set-nav-bottom{margin:22px 0 0;background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:10px}.set-nav-bottom .set-nav-secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.set-nav .nav-placeholder{min-height:44px}.set-nav-bottom .nav-heading{font-size:14px;font-weight:750;color:#52667b;margin:0}@media(max-width:550px){.set-nav-top{gap:6px}.set-nav a{font-size:13px;padding:9px 5px}.set-nav-bottom{padding:13px}}</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">5 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Set 16 / 20</span></div><p class="subtitle">Grammar &amp; Vocabulary Mix ⑯</p><p class="details">解答目安2分・700〜900点レベル</p></header><main><nav class="set-nav set-nav-top" aria-label="セット間の移動"><a href="set15.html">‹ 前へ</a><a href="index.html">目次へ</a><a href="set17.html">次へ ›</a></nav><div class="meta"><span>全5問・各問1つ選択してください</span><div class="meta-tools"><span id="progress">0 / 5 回答済み</span><button type="button" class="btn secondary small" id="reset-top">Try Again</button></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div><nav class="set-nav set-nav-bottom" aria-label="学習後の移動"><p class="nav-heading">Set 16 / 20</p><a class="primary-next" href="set17.html">次のセットへ（Set 17） →</a><div class="set-nav-secondary"><a href="set15.html">‹ 前のセット</a><a href="index.html">目次へ戻る</a></div></nav></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id":"Q076","question":"The committee deemed the proposal (　　　) of further consideration.","choices":["worthy","worth","worthwhile","worthily"],"answer":0,"translation":"委員会は、その提案にはさらに検討する価値があると判断した。","explanation":"deem + 目的語 + 補語 の構文で、形容詞 worthy が proposal の状態を表します。worthy of + 名詞句で「～に値する」。worth や worthwhile は、この worthy of の形では使えません。\n重要語句・表現：deem A B（AをBとみなす）／worthy of ～（～に値する）／further consideration（さらなる検討）"},{"id":"Q077","question":"The quality assurance team conducted additional tests to (　　　) the supplier’s claims about the durability of the new components.","choices":["expedite","diversify","corroborate","relinquish"],"answer":2,"translation":"品質保証チームは、新しい部品の耐久性に関する供給業者の主張を裏付けるため、追加試験を実施した。","explanation":"部品の耐久性に関する主張を追加試験によって「裏付ける」ため corroborate が適切です。\ncorroborate = （証拠などで）裏付ける、expedite = 迅速化する、diversify = 多様化する、relinquish = 放棄する\n重要語句・表現：corroborate（証拠によって裏付ける）／quality assurance（品質保証）／durability（耐久性）"},{"id":"Q078","question":"The report provides a comprehensive overview of the factors (　　　) the recent fluctuations in consumer demand across several major markets.","choices":["undergoing","underlying","undertaking","undermining"],"answer":1,"translation":"その報告書は、複数の主要市場で最近見られる消費者需要の変動の根底にある要因を包括的に概説している。","explanation":"需要変動の「根底にある」要因を説明する文脈なので underlying を選びます。underlying が factors を後ろから修飾しています。\nunderlying = 根底にある、undergoing = 経験している、undertaking = 引き受けている、undermining = 損なっている\n重要語句・表現：underlying（根底にある）／comprehensive overview（包括的な概説）／fluctuations in demand（需要の変動）"},{"id":"Q079","question":"Only after the revised budget had been approved (　　　) the project team begin negotiations with external contractors.","choices":["had","was","has","did"],"answer":3,"translation":"修正予算が承認されて初めて、プロジェクトチームは外部請負業者との交渉を開始した。","explanation":"Only after ... を文頭に置くと主節で倒置が起こります。過去の一般動詞 begin に対応する助動詞 did を使い、did the project team begin ... とします。\n重要語句・表現：only after ～（～して初めて）／begin negotiations（交渉を始める）／external contractors（外部の請負業者）"},{"id":"Q080","question":"Had the supplier notified the purchasing department of the shortage earlier, alternative arrangements (　　　) before production was affected.","choices":["could have been made","can be made","will have been made","had been making"],"answer":0,"translation":"供給業者が不足をもっと早く購買部門に知らせていれば、生産に影響が出る前に代替手配ができていただろう。","explanation":"Had the supplier notified ... は If the supplier had notified ... の倒置形です。過去の事実と異なる仮定を表し、手配は「される」側なので主節は could have been made になります。\n重要語句・表現：notify A of B（AにBを知らせる）／shortage（不足）／alternative arrangements（代替の手配）"}];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 5 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}
document.getElementById('grade').addEventListener('click',()=>{graded=true;const n=picks.filter((x,i)=>x===questions[i].answer).length;document.getElementById('score').textContent='結果：'+n+' / 5 問正解';render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});function tryAgain(){picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('reset').addEventListener('click',tryAgain);document.getElementById('reset-top').addEventListener('click',tryAgain);render();
</script></body></html>
