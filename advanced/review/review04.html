<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Review 04</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}

.start-panel{background:#fff;border:2px solid #12669b;border-radius:14px;padding:22px 24px;margin:16px 0 20px;text-align:center;box-shadow:0 4px 16px #112b4810}
.start-panel p{margin:0 0 12px;line-height:1.65;color:#22354f}
.start-panel p:first-child{font-size:20px}
.start-panel .btn{font-size:18px;padding:13px 28px;margin-top:5px;cursor:pointer}
.hidden-start{display:none}
.meta{position:sticky;top:0;z-index:10;background:#f2f5f9;padding:12px 6px;border-bottom:1px solid #dce4ee}
#timer{font-weight:750;color:#125c94}

.meta{display:block}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#scoreTop{display:none;margin-top:9px;padding:10px 12px;border-radius:9px;background:#e8f2fb;color:#123f66;font-size:16px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
#scoreTop.visible{display:block}
#score{font-variant-numeric:tabular-nums}
@media(max-width:550px){.meta-top{font-size:12px;gap:6px}.meta-top .instructions{display:none}#scoreTop{font-size:15px;padding:8px}}

.score-actions{display:flex;align-items:center;gap:8px}.score-actions #scoreTop{flex:1;text-align:left}.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.top-actions:has(button[hidden]){display:none}
.top-actions .btn{padding:8px 14px;font-size:13px;min-height:38px}
button[hidden]{display:none!important}
@media(max-width:550px){.meta{padding:9px 8px;margin-bottom:12px}.meta-top{display:grid;grid-template-columns:1fr auto}.meta-top #progress{text-align:right}.top-actions .btn{padding:8px 13px}#scoreTop{font-size:13px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">30 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Review 04 / 05</span></div><p class="subtitle">Grammar &amp; Vocabulary Review ④</p><p class="details">制限時間10分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="https://gamonokka-art.github.io/learning-momentum/advanced/" style="color:#12669b;font-weight:650;text-decoration:none">← Advancedの目次へ</a></nav><div id="startPanel" class="start-panel"><p><strong>30問・制限時間10分</strong></p><p>準備ができたら「Start Test」を押してください。開始後に選択肢が有効になり、タイマーが動きます。</p><button class="btn" id="startButton" type="button">Start Test</button></div><div class="meta"><div class="meta-top"><span id="timer" role="timer">残り時間 10:00</span><span class="instructions">全30問・各問1つ選択してください</span><span id="progress">0 / 30 回答済み</span></div><div class="score-actions"><div id="scoreTop" role="status" aria-live="polite"></div><div id="topActions" class="top-actions"><button class="btn secondary" id="resetTop" type="button" hidden>Try Again</button></div></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset" type="button">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id": "R04-01", "question": "The selection committee considered the research proposal (　　　) of additional funding because of its potential commercial applications.", "choices": ["worthwhile", "worthy", "worthily", "worth"], "answer": 1, "translation": "選考委員会は、商業的な応用の可能性があるため、その研究提案は追加資金を提供する価値があると判断しました。", "explanation": "worthy of ～ は「～に値する」。consider A worthy of B は「AはBに値すると判断する」です。", "source": "Q076"}, {"id": "R04-02", "question": "The pharmaceutical company conducted independent clinical trials to (　　　) the effectiveness of its newly developed treatment.", "choices": ["relinquish", "expedite", "corroborate", "diversify"], "answer": 2, "translation": "製薬会社は、新たに開発した治療法の有効性を裏付けるため、独立した臨床試験を実施しました。", "explanation": "corroborate は証拠やデータによって主張を裏付けること。relinquish＝放棄する、expedite＝迅速化する、diversify＝多様化する。", "source": "Q077"}, {"id": "R04-03", "question": "The analyst identified several (　　　) factors that contributed to the unexpected decline in quarterly revenue.", "choices": ["underlying", "undergoing", "undertaking", "undermining"], "answer": 0, "translation": "分析担当者は、四半期売上高の予想外の減少につながったいくつかの根本的な要因を特定しました。", "explanation": "underlying factors は「根底にある要因」。undergoing＝経験している、undertaking＝引き受けている、undermining＝損なっている。", "source": "Q078"}, {"id": "R04-04", "question": "Only after the revised security procedures had been approved (　　　) the company permit employees to access the new database.", "choices": ["had", "has", "was", "did"], "answer": 3, "translation": "改訂されたセキュリティ手順が承認されて初めて、会社は従業員が新しいデータベースにアクセスすることを許可しました。", "explanation": "Only after ～ を文頭に置くと主節が倒置します。過去の一般動詞 permit に対して did the company permit の形です。", "source": "Q079"}, {"id": "R04-05", "question": "Had the maintenance team detected the equipment malfunction earlier, the production shutdown (　　　).", "choices": ["could have been avoided", "will be avoided", "had been avoiding", "can avoid"], "answer": 0, "translation": "保守チームが設備の故障をもっと早く発見していれば、生産停止は回避できていたかもしれません。", "explanation": "Had + 主語 + 過去分詞 は If + 主語 + had + 過去分詞 の倒置。過去の反実仮想で、生産停止は回避される側なので could have been avoided。", "source": "Q080"}, {"id": "R04-06", "question": "The external auditors requested additional documentation to (　　　) the accuracy of the company's reported operating expenses.", "choices": ["delegate", "substantiate", "allocate", "consolidate"], "answer": 1, "translation": "外部監査人は、会社が報告した営業費用の正確性を裏付けるため、追加書類を求めました。", "explanation": "substantiate は「証拠で裏付ける」。delegate＝委任する、allocate＝配分する、consolidate＝統合する。", "source": "Q081"}, {"id": "R04-07", "question": "The financial report revealed a considerable (　　　) between the estimated project costs and the actual expenditures.", "choices": ["compliance", "compatibility", "incentive", "discrepancy"], "answer": 3, "translation": "財務報告書は、プロジェクトの見積費用と実際の支出の間にかなりの食い違いがあることを明らかにしました。", "explanation": "discrepancy between A and B は「AとBの不一致」。ほかの選択肢は順守・互換性・動機付けです。", "source": "Q082"}, {"id": "R04-08", "question": "The board carefully evaluated the potential (　　　) of relocating its manufacturing operations to another country.", "choices": ["credentials", "specifications", "implications", "qualifications"], "answer": 2, "translation": "取締役会は、生産業務を別の国に移転することによる潜在的な影響を慎重に評価しました。", "explanation": "implications は「影響・波及する結果」。credentials＝資格証明、specifications＝仕様、qualifications＝資格。", "source": "Q083"}, {"id": "R04-09", "question": "Neither the regional supervisors nor the operations director (　　　) authorized to modify the company's safety regulations without approval.", "choices": ["is", "are", "have", "be"], "answer": 0, "translation": "地域監督者も業務部長も、承認なしに会社の安全規則を変更する権限はありません。", "explanation": "neither A nor B では原則として近い主語 B に動詞を一致させます。the operations director は単数なので is。", "source": "Q084"}, {"id": "R04-10", "question": "The company launched an employee exchange program to (　　　) greater cooperation among its international offices.", "choices": ["impose", "foster", "retain", "restrict"], "answer": 1, "translation": "会社は海外拠点間の協力をさらに促進するため、従業員交流プログラムを開始しました。", "explanation": "foster cooperation は「協力を育み促進する」。impose＝課す、retain＝保持する、restrict＝制限する。", "source": "Q085"}, {"id": "R04-11", "question": "The revised service agreement allows either party to (　　　) the contract by providing written notice at least 60 days in advance.", "choices": ["compensate", "comply", "reimburse", "terminate"], "answer": 3, "translation": "改訂されたサービス契約では、いずれの当事者も少なくとも60日前に書面で通知すれば契約を終了できます。", "explanation": "terminate a contract は「契約を終了する」。ほかは補償する・従う・払い戻す。", "source": "Q086"}, {"id": "R04-12", "question": "The research findings suggest a strong (　　　) between employee engagement and overall workplace productivity.", "choices": ["concession", "contribution", "correlation", "collaboration"], "answer": 2, "translation": "研究結果は、従業員の仕事への積極的な関与と職場全体の生産性の間に強い相関関係があることを示唆しています。", "explanation": "correlation between A and B は「AとBの相関関係」。concession＝譲歩、contribution＝貢献、collaboration＝協力。", "source": "Q087"}, {"id": "R04-13", "question": "Before acquiring the commercial property, the investment firm hired an independent consultant to (　　　) its long-term financial potential.", "choices": ["assess", "assign", "assure", "assume"], "answer": 0, "translation": "商業用不動産を取得する前に、投資会社はその長期的な収益可能性を評価するため、独立したコンサルタントを雇いました。", "explanation": "assess は「評価する」。assign＝割り当てる、assure＝安心させる、assume＝仮定する。", "source": "Q088"}, {"id": "R04-14", "question": "The revised employment policy clearly (　　　) the responsibilities of supervisors when handling workplace complaints.", "choices": ["delegates", "delineates", "reimburses", "complies"], "answer": 1, "translation": "改訂された雇用方針は、職場での苦情に対応する際の監督者の責任を明確に規定しています。", "explanation": "delineate responsibilities は「責任の範囲を明確に示す」。delegate＝委任する、reimburse＝払い戻す、comply＝従う。", "source": "Q089"}, {"id": "R04-15", "question": "The actual cost of the renovation was substantially higher than the project manager had originally (　　　).", "choices": ["anticipating", "anticipation", "anticipatory", "anticipated"], "answer": 3, "translation": "改修の実際の費用は、プロジェクト責任者が当初予想していた額を大幅に上回りました。", "explanation": "had originally anticipated は過去完了形。「当初予想していた」の意味で過去分詞 anticipated を選びます。", "source": "Q090"}, {"id": "R04-16", "question": "The investigation uncovered several serious (　　　) in the company's procedures for protecting confidential customer information.", "choices": ["efficiencies", "competencies", "deficiencies", "contingencies"], "answer": 2, "translation": "調査により、顧客の機密情報を保護する会社の手順に、いくつかの重大な不備があることが判明しました。", "explanation": "deficiencies は「不備・欠陥」。efficiencies＝効率、competencies＝能力、contingencies＝不測の事態。", "source": "Q091"}, {"id": "R04-17", "question": "The proposed acquisition is currently under close (　　　) by the relevant competition authorities.", "choices": ["scrutiny", "incentive", "allocation", "compliance"], "answer": 0, "translation": "その買収案は現在、関係する競争当局による厳格な審査を受けています。", "explanation": "under close scrutiny は「厳しい精査・監視の下にある」。scrutiny は名詞です。", "source": "Q092"}, {"id": "R04-18", "question": "The compliance department instructed all regional offices to (　　　) any errors identified in their quarterly expense reports.", "choices": ["stipulate", "facilitate", "substantiate", "rectify"], "answer": 3, "translation": "コンプライアンス部門は、四半期経費報告書で見つかった誤りをすべて是正するよう各地域事務所に指示しました。", "explanation": "rectify errors は「誤りを是正する」。stipulate＝規定する、facilitate＝促進する、substantiate＝裏付ける。", "source": "Q093"}, {"id": "R04-19", "question": "Customs officials are required to (　　　) all supporting documents before authorizing the release of certain restricted goods.", "choices": ["subsidize", "scrutinize", "speculate", "supersede"], "answer": 1, "translation": "税関職員は、特定の規制対象貨物の引き渡しを許可する前に、裏付け書類をすべて精査する必要があります。", "explanation": "scrutinize は「細かく調べる・精査する」。subsidize＝補助金を出す、speculate＝推測する、supersede＝取って代わる。", "source": "Q094"}, {"id": "R04-20", "question": "The company has decided to offer the specialized training program (　　　) to employees responsible for handling sensitive financial data.", "choices": ["randomly", "reluctantly", "exclusively", "previously"], "answer": 2, "translation": "会社は、機密性の高い財務データを扱う従業員だけに、その専門研修を提供することにしました。", "explanation": "exclusively to ～ は「～に限定して」。randomly＝無作為に、reluctantly＝しぶしぶ、previously＝以前に。", "source": "Q095"}, {"id": "R04-21", "question": "The technical support team is investigating the system logs to (　　　) the exact cause of the recurring network failures.", "choices": ["ascertain", "authorize", "accommodate", "alleviate"], "answer": 0, "translation": "技術サポートチームは、繰り返し発生するネットワーク障害の正確な原因を突き止めるため、システムログを調査しています。", "explanation": "ascertain the cause は「原因を突き止める」。authorize＝認可する、accommodate＝対応する、alleviate＝軽減する。", "source": "Q096"}, {"id": "R04-22", "question": "The marketing strategy was developed using consumer preferences (　　　) to reflect recent changes in purchasing behavior.", "choices": ["adjusting", "adjustment", "adjust", "adjusted"], "answer": 3, "translation": "そのマーケティング戦略は、最近の購買行動の変化を反映するよう調整された消費者の好みを用いて策定されました。", "explanation": "adjusted は過去分詞で consumer preferences を後ろから修飾します。preferences that were adjusted ～ と言い換えられます。", "source": "Q097"}, {"id": "R04-23", "question": "The legal department advised the management team to evaluate any outstanding financial (　　　) before finalizing the merger agreement.", "choices": ["incentives", "liabilities", "credentials", "concessions"], "answer": 1, "translation": "法務部門は、合併契約を最終決定する前に未解決の財務上の債務・責任を評価するよう経営陣に助言しました。", "explanation": "financial liabilities は「財務上の負債・責任」。outstanding はここでは「未処理の・未解決の」です。", "source": "Q098"}, {"id": "R04-24", "question": "Rarely (　　　) the company experienced such strong demand for its products since entering the European market.", "choices": ["had", "did", "has", "was"], "answer": 2, "translation": "同社が欧州市場に参入して以来、製品にこれほど強い需要が寄せられたことはめったにありません。", "explanation": "Rarely が文頭に来ると倒置します。since entering ～ が現在までの期間を示すため、現在完了の has the company experienced が適切です。", "source": "Q099"}, {"id": "R04-25", "question": "The emergency response procedures are designed to (　　　) essential communication services during major power outages.", "choices": ["sustain", "stipulate", "reconcile", "substantiate"], "answer": 0, "translation": "緊急対応手順は、大規模停電時にも重要な通信サービスを維持できるよう設計されています。", "explanation": "sustain services は「サービスを維持する」。stipulate＝規定する、reconcile＝照合する、substantiate＝裏付ける。", "source": "Q100"}, {"id": "R04-26", "question": "The investment committee found the proposed renewable energy project worthy (　　　) further examination before approving additional financing.", "choices": ["for", "with", "to", "of"], "answer": 3, "translation": "投資委員会は、追加融資を承認する前に、その再生可能エネルギー計画はさらに検討する価値があると判断しました。", "explanation": "worthy of ～ は「～に値する」。worthy of further examination で「さらに検討する価値がある」。", "source": "Q076"}, {"id": "R04-27", "question": "The finance department identified several inconsistencies in the supplier invoices, (　　　) a more detailed review of the purchasing records.", "choices": ["prompted", "prompting", "to prompt", "having been prompted"], "answer": 1, "translation": "財務部門は供給業者の請求書にいくつかの不一致を発見し、その結果、購買記録のより詳しい確認が必要になりました。", "explanation": "現在分詞 prompting は前の節の出来事がもたらした結果を表します。", "source": "Q082/Q093"}, {"id": "R04-28", "question": "The executive committee expressed concern that the company's projected growth figures were not adequately (　　　) by independent market research.", "choices": ["allocated", "delegated", "substantiated", "consolidated"], "answer": 2, "translation": "経営委員会は、会社の成長予測が独立した市場調査によって十分に裏付けられていないことを懸念しました。", "explanation": "be substantiated by ～ は「～によって裏付けられる」。adequately は「十分に」。", "source": "Q081"}, {"id": "R04-29", "question": "The revised operational guidelines specify the circumstances (　　　) employees must obtain written authorization before accessing confidential files.", "choices": ["under which", "despite which", "from whom", "whose"], "answer": 0, "translation": "改訂された業務指針は、従業員が機密ファイルにアクセスする前に書面での許可を得なければならない状況を規定しています。", "explanation": "under which は「その状況の下で」。the circumstances under which ～ は関係詞節で circumstances を修飾します。", "source": "Q089"}, {"id": "R04-30", "question": "The company has established a contingency plan to (　　　) the financial impact of unexpected disruptions to its global supply network.", "choices": ["designate", "accommodate", "facilitate", "mitigate"], "answer": 3, "translation": "会社は、世界的な供給網で予期せぬ混乱が起きた場合の財務的影響を軽減するため、緊急対応計画を策定しました。", "explanation": "mitigate the impact は「影響を軽減する」。designate＝指定する、accommodate＝対応する、facilitate＝促進する。", "source": "Q100"}];let picks=Array(questions.length).fill(null),graded=false,started=false,deadline=0,clock=null;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded||!started;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 30 回答済み';document.getElementById('grade').disabled=graded||!started||picks.some(x=>x===null)}
function finish(timedOut=false){if(graded||!started)return;graded=true;clearInterval(clock);const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 30 問正解（'+(n/questions.length*100).toFixed(1)+'%）'+(timedOut?'（時間切れ・未回答は不正解）':'');document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').classList.add('visible');document.getElementById('resetTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})}function tick(){const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent='残り時間 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finish(true)}document.getElementById('grade').addEventListener('click',()=>finish(false));document.getElementById('reset').addEventListener('click',()=>{clearInterval(clock);picks.fill(null);graded=false;started=false;startButton.disabled=false;startButton.textContent='Start Test';document.getElementById('startPanel').classList.remove('hidden-start');document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').classList.remove('visible');document.getElementById('resetTop').hidden=true;document.getElementById('timer').textContent='残り時間 10:00';render();window.scrollTo({top:0,behavior:'smooth'})});const startButton=document.getElementById('startButton');document.getElementById('resetTop').addEventListener('click',()=>document.getElementById('reset').click());startButton.addEventListener('click',()=>{if(started)return;started=true;deadline=Date.now()+600000;clock=setInterval(tick,250);startButton.disabled=true;startButton.textContent='In Progress';document.getElementById('startPanel').classList.add('hidden-start');render()});render();
</script></body></html>
