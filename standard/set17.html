<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Standard Set 17</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.meta-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.btn.small{padding:8px 12px;font-size:13px;border-radius:8px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">5 Questions</span></div><div class="titleline"><h1>Business English Standard</h1><span class="setno">Set 17 / 20</span></div><p class="subtitle">Infinitives & Gerunds ①｜不定詞・動名詞</p><p class="details">解答目安2分・500〜700点レベル</p></header><main><nav style="margin:0 0 14px"><a href="index.html" style="color:#12669b;font-weight:650;text-decoration:none">← 全20セットの目次へ</a></nav><div class="meta"><span>全5問・各問1つ選択してください</span><div class="meta-tools"><span id="progress">0 / 5 回答済み</span><button type="button" class="btn secondary small" id="reset-top">Try Again</button></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const originalQuestions=[{"id":"Q081","q":"The marketing team postponed the product launch (　　　) several technical issues had not yet been resolved.","o":["despite","because","because of","due to"],"a":1,"j":"技術的な問題がいくつか未解決だったため、マーケティングチームは製品発売を延期しました。","e":"because の後ろには主語と動詞を持つ節が続きます。","v":"postpone a launch／resolve issues"},{"id":"Q082","q":"(　　　) the hotel was fully booked for the weekend, the front desk staff managed to accommodate several additional guests.","o":["Although","Despite","Because of","In spite of"],"a":0,"j":"週末はホテルが満室だったにもかかわらず、フロントスタッフは追加の宿泊客を数名受け入れました。","e":"Although は節を導く逆接の接続詞です。","v":"fully booked／accommodate guests"},{"id":"Q083","q":"The new software system will be introduced next month (　　　) the final testing phase is completed successfully.","o":["unless","even though","provided that","despite"],"a":2,"j":"最終テストが無事に完了することを条件に、新しいソフトウェアシステムが来月導入されます。","e":"provided that は「〜という条件で」を表す接続詞です。","v":"provided that／testing phase"},{"id":"Q084","q":"The company has expanded its online services significantly. (　　　), customer inquiries have increased, requiring the company to hire additional support representatives.","o":["Nevertheless","Otherwise","As a result","In contrast"],"a":2,"j":"会社はオンラインサービスを大幅に拡充しました。その結果、問い合わせが増え、サポート担当者の増員が必要になりました。","e":"As a result は前文から生じた結果を表します。","v":"as a result／customer inquiries"},{"id":"Q085","q":"The conference organizers will send a reminder email to all registered participants (　　　) the event begins.","o":["during","before","because of","despite"],"a":1,"j":"主催者はイベント開始前に登録済みの参加者全員へリマインドメールを送ります。","e":"before は後ろに節を続けて「〜する前に」を表します。","v":"send a reminder／registered participants"}];
const questions=originalQuestions.map(x=>({id:x.id,question:x.q,choices:x.o,answer:x.a,translation:x.j,explanation:x.e+(x.v?'\n重要語句・表現：'+x.v:'')}));let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 5 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}
document.getElementById('grade').addEventListener('click',()=>{graded=true;const n=picks.filter((x,i)=>x===questions[i].answer).length;document.getElementById('score').textContent='結果：'+n+' / 5 問正解';render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});function tryAgain(){picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('reset').addEventListener('click',tryAgain);document.getElementById('reset-top').addEventListener('click',tryAgain);render();
</script></body></html>
