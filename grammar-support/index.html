'use strict';
const lessonURL='01-participles.html';
function lessonCard(context='library'){return `<article class="card feature"><div class="topline"><span class="id">Grammar Support 01</span><span class="badge">利用できます</span></div><h3>分詞の使い分け</h3><p class="desc">分詞構文と名詞修飾を、「する側・される側」と「何を説明するか」で整理します。</p><div class="tags"><span class="tag">Standard中心</span><span class="tag">Advancedの復習にも</span><span class="tag">解説＋20問</span></div><div class="callout"><strong>こんなときに</strong><br>-ing形と過去分詞で迷う／分詞構文の主語がわからない／目的語の有無だけで判断してしまう</div><div class="actions"><a class="primary" href="${lessonURL}?from=${context}">解説を読む →</a><a class="secondary" href="${lessonURL}?from=${context}#check1">確認テストへ</a></div><p class="small">基本10問＋応用10問・自動採点・日本語解説</p></article>`;}
function svcCard(){return `<article class="card feature" style="margin-top:18px" data-lesson="svc"><div class="topline"><span class="id">Grammar Support 02</span><span class="badge">利用できます</span></div><h3>SVC：主語の状態・変化を伝える</h3><p class="desc">主語と補語の関係を理解し、音読・英作文・TOEIC練習へつなげます。問題は10問ずつ取り組めます。</p><div class="tags"><span class="tag">TOEIC初級</span><span class="tag">英会話基礎</span><span class="tag">Advancedの基礎確認にも</span></div><p class="small">基本解説／文章理解30問／英作文20問／TOEIC練習30問</p><div class="actions"><a class="primary" href="svc/index.html">SVCの目次へ →</a><a class="secondary" href="svc/explanation.html">基本解説を読む</a></div></article>`;}
function library(){return `<section class="hero"><p class="eyebrow">SHARED RESOURCE LIBRARY</p><h1 class="hero-title">英語の仕組みを一つずつ確かに。</h1><p class="intro">文法の基本を確かめたいときも、もう少し深く知りたいときも。<br>解説と確認テストを通して、理解を深めていきます。</p><div class="flow" aria-label="教材の流れ"><span>基本の説明</span>→<span>比較</span>→<span>問題とのつながり</span>→<span>確認テスト</span></div></section><div class="section-title"><h2>Grammar Support 共通目次</h2><span class="small" id="match-count" aria-live="polite">公開教材 2件</span></div><div class="filters"><label for="search">キーワードで探す<input id="search" type="search" placeholder="例：分詞、目的語、Q084" autocomplete="off"></label><label for="level">学習レベル<select id="level"><option value="all">すべてのレベル</option><option value="standard">Standard（500〜700）</option><option value="advanced">Advanced（700〜900）</option></select></label></div><div class="grid"><div><div id="lesson-result"><div data-lesson="participles">${lessonCard()}</div>${svcCard()}</div><div id="no-results" class="empty hidden">該当する教材はありません。<br>別のキーワードでお試しください。</div></div><aside class="card"><p class="eyebrow">HOW TO USE</p><h2>必要なところから。</h2><ol class="steps"><li>間違えた問題や疑問から、テーマを選びます。</li><li>説明と例文で、文の関係を確認します。</li><li>確認テストを解き、元の問題に戻ります。</li></ol><hr class="divider"><p class="small">番号は教材を管理するためのものです。01から順番に学ぶ必要はありません。</p><p class="small">Advancedの学習中でも、Standardの内容に戻って確認できます。</p></aside></div><section class="planned"><div class="section-title"><h2>これから増やしていくテーマ</h2></div><p class="small">以下は制作候補です。生徒さんの質問やつまずきに合わせて追加していきます。</p><div class="planned-list"><article class="card"><span class="badge plan">制作候補</span><h3>動名詞の後ろの形</h3><p class="desc">目的語・前置詞・自動詞の関係を確認。</p></article><article class="card"><span class="badge plan">制作候補</span><h3>時制の使い分け</h3><p class="desc">過去形・現在完了・過去完了を整理。</p></article><article class="card"><span class="badge plan">制作候補</span><h3>前置詞と接続詞</h3><p class="desc">後ろに続く形と意味のつながりを確認。</p></article></div></section>`;}
function applySearch(){const q=document.getElementById('search').value.trim().toLowerCase().replace(/\s+/g,'');const keywords={participles:'grammarsupport01分詞現在分詞過去分詞名詞修飾形容詞分詞構文自動詞他動詞目的語q084requiring結果standardadvanced',svc:'grammarsupport02svc第2文型第二文型svo主語補語目的語自動詞他動詞形容詞名詞状態変化感覚runlooksoundsmellfeel文章理解英作文toeic初級英会話基礎standardadvanced'};let count=0;for(const [id,words] of Object.entries(keywords)){const match=!q||words.includes(q);document.querySelector('[data-lesson="'+id+'"]').classList.toggle('hidden',!match);if(match)count++;}document.getElementById('no-results').classList.toggle('hidden',count>0);document.getElementById('match-count').textContent=`該当教材 ${count}件`;}
function render(){document.getElementById('content').innerHTML=library();document.getElementById('search').addEventListener('input',applySearch);document.getElementById('level').addEventListener('change',applySearch);}
render();
</script></body></html>
