<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Set 02</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.meta-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.btn.small{padding:8px 12px;font-size:13px;border-radius:8px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}
.set-nav{margin:0 0 18px}.set-nav-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.set-nav a{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:750;border-radius:9px;min-height:44px;padding:10px 12px;border:1px solid #c9d7e6;background:#fff;color:#24557e}.set-nav a:hover,.set-nav a:focus-visible{background:#e6f0fa}.set-nav a.primary-next{background:#12669b;border-color:#12669b;color:white;font-size:16px;min-height:48px}.set-nav a.primary-next:hover,.set-nav a.primary-next:focus-visible{background:#0d4d78}.set-nav-bottom{margin:22px 0 0;background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:10px}.set-nav-bottom .set-nav-secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.set-nav .nav-placeholder{min-height:44px}.set-nav-bottom .nav-heading{font-size:14px;font-weight:750;color:#52667b;margin:0}@media(max-width:550px){.set-nav-top{gap:6px}.set-nav a{font-size:13px;padding:9px 5px}.set-nav-bottom{padding:13px}}</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">5 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Set 02 / 20</span></div><p class="subtitle">Grammar &amp; Vocabulary Mix ②</p><p class="details">解答目安2分・700〜900点レベル</p></header><main><nav class="set-nav set-nav-top" aria-label="セット間の移動"><a href="set01.html">‹ 前へ</a><a href="index.html">目次へ</a><a href="set03.html">次へ ›</a></nav><div class="meta"><span>全5問・各問1つ選択してください</span><div class="meta-tools"><span id="progress">0 / 5 回答済み</span><button type="button" class="btn secondary small" id="reset-top">Try Again</button></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div><nav class="set-nav set-nav-bottom" aria-label="学習後の移動"><p class="nav-heading">Set 02 / 20</p><a class="primary-next" href="set03.html">次のセットへ（Set 03） →</a><div class="set-nav-secondary"><a href="set01.html">‹ 前のセット</a><a href="index.html">目次へ戻る</a></div></nav></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id":"Q006","question":"The accounting department requires (　　　) authorization before processing reimbursements exceeding $5,000.","choices":["previously","prior","priority","prioritize"],"answer":1,"translation":"経理部門は5,000ドルを超える経費精算を処理する前に事前承認を求めている。","explanation":"名詞 authorization を修飾し「事前の承認」を表す形容詞 prior を選びます。before processing ... と合わせ、処理前に承認が必要だと分かります。\n重要語句・表現：prior authorization（事前承認）／process reimbursements（払い戻しを処理する）／exceed（超える）"},{"id":"Q007","question":"The compliance officer asked the team to (　　　) all references to customer identities before sharing the case files with external reviewers.","choices":["reconcile","reinstate","redact","retrieve"],"answer":2,"translation":"コンプライアンス担当者は、外部の審査担当者に案件資料を共有する前に、顧客の身元がわかる記述をすべて伏せるようチームに指示した。","explanation":"外部の審査担当者に共有する前に顧客を特定する記述を伏せる必要があるため、redact が文脈に合います。\nredact = 機密情報などを文書から削除する、黒塗りする\nreconcile = 照合する、調整する\nreinstate = 復職・復帰させる、元に戻す\nretrieve = 取り出す、回収する\n重要語句・表現：redact（機密情報を削除する・黒塗りする）／customer identities（顧客を特定する情報）／external reviewers（外部の審査担当者）"},{"id":"Q008","question":"(　　　) the equipment undergoes routine maintenance, unexpected mechanical failures may still occur.","choices":["Even though","Despite","In spite of","Nevertheless"],"answer":0,"translation":"機器が定期的に整備されていても、予期しない機械故障は起こり得る。","explanation":"定期保守を受けている「にもかかわらず」故障が起こり得る、という譲歩の関係です。後ろに主語と動詞を含む節が続くため Even though を選びます。\n重要語句・表現：even though ～（～にもかかわらず）／undergo routine maintenance（定期保守を受ける）／mechanical failure（機械の故障）"},{"id":"Q009","question":"Following the unexpected increase in production costs, the manufacturer decided to (　　　) its pricing strategy to remain competitive.","choices":["retrieve","retain","revise","resolve"],"answer":2,"translation":"製造費用の予想外の上昇を受け、製造業者は競争力を維持するため価格戦略を見直すことにした。","explanation":"生産費の上昇を受け、競争力を保つために価格戦略を「見直す」という文脈なので revise が適切です。decide to の後は動詞の原形です。\n重要語句・表現：revise（修正する・見直す）／pricing strategy（価格戦略）／remain competitive（競争力を維持する）"},{"id":"Q010","question":"(　　　) the new software requires additional training, management expects it to improve overall productivity in the long term.","choices":["Despite","Although","Nevertheless","In spite of"],"answer":1,"translation":"新しいソフトウェアには追加研修が必要ではあるが、経営陣は長期的には全体の生産性が向上すると期待している。","explanation":"追加研修が必要という不利な点と、生産性向上への期待を結び付ける譲歩の接続詞 Although が適切です。後ろには the new software requires ... という節が続きます。\n重要語句・表現：although ～（～ではあるが）／overall productivity（全体的な生産性）／in the long term（長期的には）"}];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 5 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}
document.getElementById('grade').addEventListener('click',()=>{graded=true;const n=picks.filter((x,i)=>x===questions[i].answer).length;document.getElementById('score').textContent='結果：'+n+' / 5 問正解';render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});function tryAgain(){picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('reset').addEventListener('click',tryAgain);document.getElementById('reset-top').addEventListener('click',tryAgain);render();
</script></body></html>
