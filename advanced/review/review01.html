<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Review 01</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}

.start-panel{background:#fff;border:2px solid #12669b;border-radius:14px;padding:22px 24px;margin:16px 0 20px;text-align:center;box-shadow:0 4px 16px #112b4810}
.start-panel p{margin:0 0 12px;line-height:1.65;color:#22354f}
.start-panel p:first-child{font-size:20px}
.start-panel .btn{font-size:18px;padding:13px 28px;margin-top:5px;cursor:pointer}
.hidden-start{display:none}
.meta{position:sticky;top:0;z-index:10;background:#f2f5f9;padding:12px 6px;border-bottom:1px solid #dce4ee}
#timer{font-weight:750;color:#125c94}

.meta{display:block}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#scoreTop{display:none;margin-top:9px;padding:10px 12px;border-radius:9px;background:#e8f2fb;color:#123f66;font-size:16px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
#scoreTop.visible{display:block}
#score{font-variant-numeric:tabular-nums}
@media(max-width:550px){.meta-top{font-size:12px;gap:6px}.meta-top .instructions{display:none}#scoreTop{font-size:15px;padding:8px}}

.score-actions{display:flex;align-items:center;gap:8px}.score-actions #scoreTop{flex:1;text-align:left}.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.top-actions:has(button[hidden]){display:none}
.top-actions .btn{padding:8px 14px;font-size:13px;min-height:38px}
button[hidden]{display:none!important}
@media(max-width:550px){.meta{padding:9px 8px;margin-bottom:12px}.meta-top{display:grid;grid-template-columns:1fr auto}.meta-top #progress{text-align:right}.top-actions .btn{padding:8px 13px}#scoreTop{font-size:13px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">30 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Review 01 / 05</span></div><p class="subtitle">Grammar &amp; Vocabulary Review ①</p><p class="details">制限時間10分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="https://gamonokka-art.github.io/learning-momentum/advanced/" style="color:#12669b;font-weight:650;text-decoration:none">← Advancedの目次へ</a></nav><div id="startPanel" class="start-panel"><p><strong>30問・制限時間10分</strong></p><p>準備ができたら「Start Test」を押してください。開始後に選択肢が有効になり、タイマーが動きます。</p><button class="btn" id="startButton" type="button">Start Test</button></div><div class="meta"><div class="meta-top"><span id="timer" role="timer">残り時間 10:00</span><span class="instructions">全30問・各問1つ選択してください</span><span id="progress">0 / 30 回答済み</span></div><div class="score-actions"><div id="scoreTop" role="status" aria-live="polite"></div><div id="topActions" class="top-actions"><button class="btn secondary" id="resetTop" type="button" hidden>Try Again</button></div></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset" type="button">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id": "R01-01", "question": "All shortlisted candidates (　　　) of the final hiring decision by Friday afternoon.", "choices": ["notify", "will be notified", "have notifying", "were notifying"], "answer": 1, "translation": "最終候補に残った応募者全員には、金曜日の午後までに最終的な採用決定が通知されます。", "explanation": "応募者は通知を受ける側なので受動態。by Friday afternoon は未来の期限を表すため、will be notified が適切です。"}, {"id": "R01-02", "question": "The revised inspection procedures must be applied (　　　) at every production facility.", "choices": ["consistency", "consistent", "consistently", "consist"], "answer": 2, "translation": "改訂された検査手順は、すべての生産施設で一貫して適用されなければなりません。", "explanation": "動詞 applied を修飾するのは副詞 consistently（一貫して）です。"}, {"id": "R01-03", "question": "The advisory group specializes (　　　) helping retailers manage cross-border payments.", "choices": ["for", "with", "at", "in"], "answer": 3, "translation": "その助言グループは、小売業者の国境を越える決済管理を支援することを専門としています。", "explanation": "specialize in + 名詞／動名詞で「〜を専門とする」という意味です。"}, {"id": "R01-04", "question": "The proposals (　　　) at last week's budget meeting are now being evaluated by the finance committee.", "choices": ["presenting", "presented", "presentation", "present"], "answer": 1, "translation": "先週の予算会議で提示された提案は、現在、財務委員会によって評価されています。", "explanation": "proposals と present は受動の関係なので、過去分詞 presented が後ろから proposals を修飾します。"}, {"id": "R01-05", "question": "(　　　) the supplier offered a substantial discount, the purchasing team selected a different vendor because of delivery concerns.", "choices": ["Despite", "Nevertheless", "Although", "In spite of"], "answer": 2, "translation": "その供給業者は大幅な値引きを提示しましたが、購買チームは納期への懸念から別の業者を選びました。", "explanation": "後ろに the supplier offered ... という主語と動詞を備えた節が続くため、接続詞 Although が適切です。Despite／In spite of の後ろには通常、名詞句や動名詞句が続きます。"}, {"id": "R01-06", "question": "Before releasing the report publicly, the legal team instructed staff to (　　　) all personal identification numbers.", "choices": ["redact", "restore", "obtain", "reconcile"], "answer": 0, "translation": "報告書を一般公開する前に、法務チームは職員にすべての個人識別番号を黒塗りして伏せるよう指示しました。", "explanation": "redact は公開文書などから機密情報を削除・黒塗りすることです。個人情報を保護する文脈に合います。"}, {"id": "R01-07", "question": "To minimize disruption, the company will (　　　) transfer its customer records to the new platform over several months.", "choices": ["abruptly", "rarely", "temporarily", "gradually"], "answer": 3, "translation": "混乱を最小限に抑えるため、同社は数か月かけて顧客記録を新しいプラットフォームへ段階的に移行します。", "explanation": "over several months と To minimize disruption が手掛かりです。gradually は「徐々に、段階的に」を意味します。"}, {"id": "R01-08", "question": "The warranty offered by this supplier is more comprehensive than (　　　) provided by its competitors.", "choices": ["those", "that", "them", "these"], "answer": 1, "translation": "この供給業者が提供する保証は、競合他社が提供する保証よりも内容が充実しています。", "explanation": "that は前に出た単数名詞 the warranty を受け、同じ名詞の繰り返しを避けています。複数名詞を受ける場合は those を使います。"}, {"id": "R01-09", "question": "The revised contract will not take effect (　　　) both parties have signed the final document.", "choices": ["until", "during", "despite", "whereas"], "answer": 0, "translation": "改訂された契約は、双方が最終文書に署名するまで発効しません。", "explanation": "not ... until ～ で「～するまで…しない」。until は後ろに節を取ることができます。"}, {"id": "R01-10", "question": "The engineering team requested a more (　　　) breakdown of projected maintenance expenses.", "choices": ["precision", "precisely", "precise", "preciseness"], "answer": 2, "translation": "技術チームは、予想される保守費用について、より正確な内訳を求めました。", "explanation": "more と名詞 breakdown の間には形容詞 precise が入ります。precision は名詞、precisely は副詞です。"}, {"id": "R01-11", "question": "The updated security protocol will be implemented (　　　) across all branches starting next month.", "choices": ["uniform", "uniformity", "uniformly", "unify"], "answer": 2, "translation": "改訂されたセキュリティ手順は来月から全支店で統一的に実施されます。", "explanation": "be implemented uniformly（統一的に実施される）。動詞の受動態を修飾する副詞 uniformly が適切です。【本編対応：Q002】"}, {"id": "R01-12", "question": "The outdated billing software will be (　　　) with a cloud-based system by the end of the year.", "choices": ["replacement", "replaced", "replacing", "replace"], "answer": 1, "translation": "旧式の請求ソフトウェアは年末までにクラウド型システムに置き換えられます。", "explanation": "be replaced with ～ で「～に置き換えられる」。受動態なので過去分詞 replaced を使います。【本編対応：Q003】"}, {"id": "R01-13", "question": "All travel requests must be submitted at least five business days (　　　) to departure.", "choices": ["previous", "advance", "prior", "early"], "answer": 2, "translation": "出張申請は出発の少なくとも5営業日前までに提出する必要があります。", "explanation": "prior to ～ は「～に先立って」。前置詞 to と組み合わせる定型表現です。【本編対応：Q006】"}, {"id": "R01-14", "question": "(　　　) the software passed the initial tests, the team postponed its launch to address security issues.", "choices": ["Despite", "In spite of", "Even though", "Because of"], "answer": 2, "translation": "ソフトウェアは初期試験に合格したものの、チームはセキュリティ上の問題に対処するため公開を延期しました。", "explanation": "Even though は譲歩の接続詞で、後ろに主語と動詞を含む節が続きます。【本編対応：Q008】"}, {"id": "R01-15", "question": "The operations director asked the team to (　　　) the project timeline after the delivery schedule changed.", "choices": ["revision", "revised", "revising", "revise"], "answer": 3, "translation": "納品予定が変更されたため、業務部長はチームにプロジェクトの予定表を修正するよう求めました。", "explanation": "ask + 人 + to + 動詞原形。revise は「修正する、見直す」です。【本編対応：Q009】"}, {"id": "R01-16", "question": "Customer feedback (　　　) the company to redesign its online reservation system.", "choices": ["prompted", "reimbursed", "allocated", "stipulated"], "answer": 0, "translation": "顧客からの意見を受け、会社はオンライン予約システムを再設計しました。", "explanation": "prompt + 人 + to do は「人に～するよう促す」。feedback が改善のきっかけになった文脈です。【本編対応：Q012】"}, {"id": "R01-17", "question": "The new mentoring program is intended to (　　　) employee retention among newly hired staff.", "choices": ["enhancement", "enhanced", "enhance", "enhancing"], "answer": 2, "translation": "新しいメンタリング制度は新入社員の定着率を高めることを目的としています。", "explanation": "be intended to + 動詞原形。enhance employee retention は「従業員の定着率を高める」です。【本編対応：Q014】"}, {"id": "R01-18", "question": "The auditor requested receipts (　　　) all expenses claimed during the conference.", "choices": ["document", "documented", "documenting", "documentation"], "answer": 2, "translation": "監査担当者は、会議中に申請されたすべての経費を裏付ける領収書を求めました。", "explanation": "receipts documenting ～ は「～を証明する領収書」。現在分詞が receipts を後ろから修飾します。【本編対応：Q016】"}, {"id": "R01-19", "question": "This software package is particularly well (　　　) for small businesses with limited IT resources.", "choices": ["suit", "suitable", "suited", "suiting"], "answer": 2, "translation": "このソフトウェア製品はIT資源が限られた小規模企業に特に適しています。", "explanation": "be well suited for ～ は「～に非常に適している」という表現です。【本編対応：Q018】"}, {"id": "R01-20", "question": "The publisher plans to (　　　) its international readership by offering articles in additional languages.", "choices": ["broad", "breadth", "broadly", "broaden"], "answer": 3, "translation": "出版社は記事をさらに多くの言語で提供し、海外の読者層を広げる計画です。", "explanation": "plan to の後には動詞原形。broaden は「広げる」です。【本編対応：Q019】"}, {"id": "R01-21", "question": "The committee requires (　　　) evidence that the equipment meets all applicable safety standards.", "choices": ["document", "documenting", "documented", "documentation"], "answer": 2, "translation": "委員会は、その機器が適用されるすべての安全基準を満たすことを示す文書で裏付けられた証拠を求めています。", "explanation": "documented evidence は「文書で裏付けられた証拠」。過去分詞 documented が名詞を修飾します。【本編対応：Q020】"}, {"id": "R01-22", "question": "The new inventory system allows warehouse staff to process orders more (　　　).", "choices": ["efficient", "efficiency", "efficiently", "efficiencies"], "answer": 2, "translation": "新しい在庫管理システムにより、倉庫のスタッフは注文をより効率的に処理できます。", "explanation": "process orders を修飾する副詞 efficiently が正解です。【本編対応：Q021】"}, {"id": "R01-23", "question": "The maintenance costs of the new vehicles are significantly lower than (　　　) of the older models.", "choices": ["that", "those", "them", "these"], "answer": 1, "translation": "新型車両の維持費は旧型車両の維持費より大幅に低くなっています。", "explanation": "複数名詞 maintenance costs の繰り返しを避けるため those を使います。単数名詞なら that です。【本編対応：Q022】"}, {"id": "R01-24", "question": "The temporary access restrictions will remain in place (　　　) the network upgrade is complete.", "choices": ["unless", "while", "since", "until"], "answer": 3, "translation": "ネットワークの更新が完了するまで、一時的なアクセス制限は継続されます。", "explanation": "remain in place until ～ は「～まで継続する」。until は終了時点を示します。【本編対応：Q023】"}, {"id": "R01-25", "question": "The procurement team needs a (　　　) supplier that can consistently meet strict delivery deadlines.", "choices": ["rely", "reliability", "reliably", "reliable"], "answer": 3, "translation": "調達チームには厳しい納期を安定して守れる信頼性の高い供給業者が必要です。", "explanation": "名詞 supplier を修飾する形容詞 reliable（信頼できる）が適切です。【本編対応：Q024】"}, {"id": "R01-26", "question": "The consultant provided a (　　　) estimate of the cost of upgrading the manufacturing equipment.", "choices": ["precision", "precisely", "precise", "preciseness"], "answer": 2, "translation": "コンサルタントは製造設備の更新費用について正確な見積もりを提示しました。", "explanation": "名詞 estimate を修飾する形容詞 precise（正確な）が必要です。【本編対応：Q025】"}, {"id": "R01-27", "question": "The marketing division is responsible (　　　) coordinating the launch of the new product line.", "choices": ["to", "at", "with", "for"], "answer": 3, "translation": "マーケティング部門は新製品ラインの発売を調整する責任を負っています。", "explanation": "be responsible for ～ は「～に責任がある」。for の後には名詞または動名詞が続きます。【本編対応：Q015】"}, {"id": "R01-28", "question": "The proposed changes were (　　　) during the quarterly management meeting.", "choices": ["discuss", "discussing", "discussed", "discussion"], "answer": 2, "translation": "提案された変更は四半期ごとの経営会議で議論されました。", "explanation": "changes は議論される対象なので、受動態 were discussed が適切です。【本編対応：Q005】"}, {"id": "R01-29", "question": "(　　　) the revised proposal was more expensive, the board approved it because of its long-term benefits.", "choices": ["Despite", "Although", "Nevertheless", "In spite of"], "answer": 1, "translation": "改訂案は費用が高かったものの、長期的な利点を理由に取締役会は承認しました。", "explanation": "Although の後ろには主語と動詞を含む節が続きます。Despite と In spite of は名詞句を取ります。【本編対応：Q010】"}, {"id": "R01-30", "question": "The organization introduced a new reporting procedure (　　　) improve transparency across departments.", "choices": ["for", "so that", "to", "because"], "answer": 2, "translation": "その組織は部門間の透明性を高めるため、新しい報告手順を導入しました。", "explanation": "目的を表す to + 動詞原形（to improve）。so that なら主語と動詞を含む節が必要です。【本編対応：Q015】"}];let picks=Array(questions.length).fill(null),graded=false,started=false,deadline=0,clock=null;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded||!started;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 30 回答済み';document.getElementById('grade').disabled=graded||!started||picks.some(x=>x===null)}
function finish(timedOut=false){if(graded||!started)return;graded=true;clearInterval(clock);const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 30 問正解（'+(n/questions.length*100).toFixed(1)+'%）'+(timedOut?'（時間切れ・未回答は不正解）':'');document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').classList.add('visible');document.getElementById('resetTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})}function tick(){const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent='残り時間 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finish(true)}document.getElementById('grade').addEventListener('click',()=>finish(false));document.getElementById('reset').addEventListener('click',()=>{clearInterval(clock);picks.fill(null);graded=false;started=false;startButton.disabled=false;startButton.textContent='Start Test';document.getElementById('startPanel').classList.remove('hidden-start');document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').classList.remove('visible');document.getElementById('resetTop').hidden=true;document.getElementById('timer').textContent='残り時間 10:00';render();window.scrollTo({top:0,behavior:'smooth'})});const startButton=document.getElementById('startButton');document.getElementById('resetTop').addEventListener('click',()=>document.getElementById('reset').click());startButton.addEventListener('click',()=>{if(started)return;started=true;deadline=Date.now()+600000;clock=setInterval(tick,250);startButton.disabled=true;startButton.textContent='In Progress';document.getElementById('startPanel').classList.add('hidden-start');render()});render();
</script></body></html>
