<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 11</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 11 / 20</div><h1>Business English Standard</h1><div>Infinitives & Gerunds ①｜不定詞・動名詞</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[{"id":"Q051","q":"The company installed additional security cameras in the warehouse (　　　) unauthorized access to restricted areas.","o":["prevent","preventing","to prevent","prevented"],"a":2,"j":"会社は、立入制限区域への不正な侵入を防ぐため、倉庫に監視カメラを追加設置しました。","e":"to prevent は目的を表す不定詞で「～を防ぐために」という意味です。installed が文の動詞なので、ここでは目的を示す to 不定詞が自然です。","v":"install security cameras（監視カメラを設置する）／prevent unauthorized access（不正な立ち入りを防ぐ）"},{"id":"Q052","q":"The new scheduling system is intended to prevent employees from (　　　) overlapping appointments with clients.","o":["arrange","arranging","arranged","to arrange"],"a":1,"j":"新しいスケジュール管理システムは、従業員が顧客との予約を重複して入れることを防ぐためのものです。","e":"prevent A from doing は「Aが～するのを防ぐ」という構文です。前置詞 from の後ろには動名詞 arranging を置きます。","v":"be intended to do（～することを意図している）／prevent A from doing（Aが～するのを防ぐ）"},{"id":"Q053","q":"The regional manager recommended (　　　) the orientation program to include more practical training for new employees.","o":["expand","expanding","expanded","to expand"],"a":1,"j":"地域担当マネージャーは、新入社員向けの実践的な研修を増やすため、オリエンテーションプログラムを拡充することを勧めました。","e":"recommend doing は「～することを勧める」という表現です。recommend の直後に動作を置く場合、動名詞 expanding を使います。","v":"recommend doing（～することを勧める）／practical training（実践的な研修）"},{"id":"Q054","q":"The instructions for operating the new equipment were too complicated for some employees (　　　) without assistance.","o":["understand","understanding","understood","to understand"],"a":3,"j":"新しい機器の操作説明は複雑すぎて、一部の従業員には助けなしで理解できませんでした。","e":"too + 形容詞 + for A + to do は「Aにとって～すぎて…できない」という構文です。to understand が正解です。","v":"too ... to do（～すぎて…できない）／without assistance（助けなしで）"},{"id":"Q055","q":"The project manager reminded all team members (　　　) their progress reports before Friday's meeting.","o":["submit","submitting","to submit","submitted"],"a":2,"j":"プロジェクトマネージャーは、金曜日の会議までに進捗報告書を提出するようチーム全員に念を押しました。","e":"remind A to do は「Aに～するよう念を押す」という構文です。目的語 all team members の後ろには to submit を置きます。","v":"remind A to do（Aに～するよう念を押す）／progress report（進捗報告書）"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！不定詞と動名詞の使い分けを理解できています。':'解説を確認して、不定詞と動名詞の使い分けを復習しましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
