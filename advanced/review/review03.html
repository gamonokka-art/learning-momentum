<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Review 03</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}

</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">30 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Review 03 / 05</span></div><p class="subtitle">Grammar &amp; Vocabulary Review ③</p><p class="details">制限時間10分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="https://gamonokka-art.github.io/learning-momentum/advanced/" style="color:#12669b;font-weight:650;text-decoration:none">← Advancedの目次へ</a></nav><div id="startPanel" class="start-panel"><p><strong>30問・制限時間10分</strong></p><p>準備ができたら「Start Test」を押してください。開始後に選択肢が有効になり、タイマーが動きます。</p><button class="btn" id="startButton" type="button">Start Test</button></div><div class="meta"><div class="meta-top"><span id="timer" role="timer">残り時間 10:00</span><span class="instructions">全30問・各問1つ選択してください</span><span id="progress">0 / 30 回答済み</span></div><div class="score-actions"><div id="scoreTop" role="status" aria-live="polite"></div><div id="topActions" class="top-actions"><button class="btn secondary" id="resetTop" type="button" hidden>Try Again</button></div></div></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset" type="button">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id":"R03-01","question":"Had the logistics team received the updated shipping instructions earlier, it (　　　) the delivery error.","choices":["will prevent","would have prevented","had prevented","would prevent"],"answer":1,"translation":"物流チームが更新された出荷指示をもっと早く受け取っていれば、配送ミスを防げていたでしょう。","explanation":"Had + 主語 + 過去分詞は If + 主語 + had + 過去分詞 の倒置形。過去の事実と異なる仮定なので、主節は would have + 過去分詞です。\n重要語句・表現：shipping instructions（出荷指示）／prevent a delivery error（配送ミスを防ぐ）／logistics team（物流チーム）"},{"id":"R03-02","question":"By the time the international trade fair begins next Thursday, our sales representatives (　　　) all the promotional materials.","choices":["had prepared","are preparing","will have prepared","have been prepared"],"answer":2,"translation":"来週木曜日に国際見本市が始まるまでには、営業担当者たちは販促資料をすべて準備し終えているでしょう。","explanation":"未来の基準時点までの完了を表す未来完了 will have prepared を選びます。by the time 節では未来のことでも現在形 begins を使います。\n重要語句・表現：international trade fair（国際見本市）／sales representatives（営業担当者）／promotional materials（販促資料）"},{"id":"R03-03","question":"The decision to upgrade the manufacturing equipment was primarily (　　　) by the need to improve energy efficiency.","choices":["driven","conveyed","enforced","derived"],"answer":0,"translation":"製造設備を更新する決定は、主にエネルギー効率を改善する必要性によって促されました。","explanation":"be driven by ～ は「～によって推進・促進される」。決定の動機を表す文脈に合います。\n重要語句・表現：upgrade equipment（設備を更新する）／be driven by ～（～が主な要因となる）／energy efficiency（エネルギー効率）"},{"id":"R03-04","question":"The training seminar attracted more than 200 professionals, several of (　　　) had traveled from overseas.","choices":["which","whose","that","whom"],"answer":3,"translation":"研修セミナーには200人以上の専門職が参加し、そのうち数人は海外から来ていました。","explanation":"several of whom は「そのうちの数人」。先行詞 professionals は人で、前置詞 of の後に関係代名詞 whom を置きます。\n重要語句・表現：attract professionals（専門家を集める）／several of whom（そのうちの数人が）／from overseas（海外から）"},{"id":"R03-05","question":"The company will proceed with the product launch as planned, (　　　) some distributors have expressed concerns about the schedule.","choices":["despite","although","nevertheless","regardless"],"answer":1,"translation":"一部の販売代理店が日程に懸念を示しているものの、会社は予定どおり製品を発売します。","explanation":"although は後ろに主語と動詞を伴う節を導きます。despite は前置詞、nevertheless は副詞です。\n重要語句・表現：proceed with ～（～を進める）／product launch（製品発売）／express concerns（懸念を示す）"},{"id":"R03-06","question":"The compliance officer demanded that all confidential records (　　　) in an encrypted database.","choices":["are stored","have stored","be stored","were storing"],"answer":2,"translation":"コンプライアンス担当者は、機密記録をすべて暗号化されたデータベースに保存するよう要求しました。","explanation":"demand that S + 動詞の原形 の構文。記録は保存される側なので受動態の原形 be stored です。\n重要語句・表現：compliance officer（法令順守担当者）／confidential records（機密記録）／encrypted database（暗号化されたデータベース）"},{"id":"R03-07","question":"Customers may receive complimentary technical support (　　　) their service agreements remain active.","choices":["provided that","whereas","despite","otherwise"],"answer":0,"translation":"顧客は、サービス契約が有効である限り、無料の技術サポートを受けられます。","explanation":"provided that + 節 は「～という条件で」。契約が有効であることを条件として示します。\n重要語句・表現：complimentary（無料の）／provided that ～（～という条件で）／service agreement（サービス契約）"},{"id":"R03-08","question":"Not until the safety audit was completed (　　　) the management team authorize the reopening of the warehouse.","choices":["had","was","has","did"],"answer":3,"translation":"安全監査が完了して初めて、経営陣は倉庫の再開を許可しました。","explanation":"Not until が文頭に来ると主節で倒置が起こります。過去の一般動詞 authorize の前には did を置きます。\n重要語句・表現：safety audit（安全監査）／authorize（許可する・認可する）／reopening of the warehouse（倉庫の再開）"},{"id":"R03-09","question":"Investors have questioned the financial (　　　) of the proposed development because of rising construction costs.","choices":["volatility","viability","visibility","versatility"],"answer":1,"translation":"建設費の上昇を受け、投資家は開発計画の財務的な実現可能性に疑問を呈しています。","explanation":"financial viability は「財務的な実現可能性・採算性」。volatility＝変動性、visibility＝可視性、versatility＝多用途性。\n重要語句・表現：financial viability（財務的な実現可能性・採算性）／proposed development（開発計画）／construction costs（建設費）"},{"id":"R03-10","question":"The renovated conference center, (　　　) main auditorium can accommodate 800 guests, will reopen in January.","choices":["which","whom","whose","that"],"answer":2,"translation":"メインホールに800人を収容できる改装済みの会議施設は、1月に再開します。","explanation":"whose + 名詞 で所有関係を表します。whose main auditorium は「その施設のメインホールが」。\n重要語句・表現：renovated（改修された）／main auditorium（メインホール・大講堂）／accommodate（収容する）"},{"id":"R03-11","question":"The committee considered four alternative proposals, none of (　　　) met the project's technical requirements.","choices":["which","whom","whose","that"],"answer":0,"translation":"委員会は4つの代替案を検討しましたが、そのどれもプロジェクトの技術要件を満たしませんでした。","explanation":"none of which は「そのどれも～ない」。先行詞 proposals は物で、非制限用法では which を使います。\n重要語句・表現：alternative proposals（代替案）／none of which（そのどれも～ない）／meet technical requirements（技術要件を満たす）"},{"id":"R03-12","question":"The revised onboarding program has reduced administrative delays, (　　　) improving the experience of newly hired employees.","choices":["nevertheless","otherwise","despite","thereby"],"answer":3,"translation":"改訂された入社時研修プログラムは事務手続きの遅れを減らし、それによって新入社員の体験を改善しました。","explanation":"thereby + -ing は「それによって～する」。前の出来事の結果を表します。\n重要語句・表現：onboarding program（新入社員の受け入れ・導入研修制度）／administrative delays（事務処理の遅れ）／thereby doing（それによって～する）"},{"id":"R03-13","question":"The engineering department introduced a temporary solution to (　　　) the limitations of the existing network infrastructure.","choices":["reimburse","circumvent","substantiate","consolidate"],"answer":1,"translation":"技術部門は既存のネットワーク基盤の制約を回避するため、一時的な解決策を導入しました。","explanation":"circumvent limitations は「制約を回避する」。reimburse＝払い戻す、substantiate＝裏付ける、consolidate＝統合・強化する。\n重要語句・表現：temporary solution（暫定的な解決策）／circumvent limitations（制約を回避する）／network infrastructure（ネットワーク基盤）"},{"id":"R03-14","question":"Following an unexpected decline in demand, the manufacturer decided to (　　　) its plans to open another production facility.","choices":["deduct","derive","defer","deter"],"answer":2,"translation":"需要が予想外に減少したため、製造業者は新たな生産施設を開設する計画を延期することにしました。","explanation":"defer plans は「計画を延期する」。deduct＝差し引く、derive＝引き出す、deter＝思いとどまらせる。\n重要語句・表現：decline in demand（需要の減少）／defer plans（計画を延期する）／production facility（生産施設）"},{"id":"R03-15","question":"The newly acquired software must be fully (　　　) with the company's current inventory management system.","choices":["compatible","competitive","comprehensive","comparable"],"answer":0,"translation":"新たに導入したソフトウェアは、現在の在庫管理システムと完全に互換性がなければなりません。","explanation":"be compatible with ～ は「～と互換性がある」。前置詞 with との組み合わせが重要です。\n重要語句・表現：newly acquired（新たに取得した）／be compatible with ～（～と互換性がある）／inventory management system（在庫管理システム）"},{"id":"R03-16","question":"The accounting department is working to (　　　) several discrepancies between the bank statements and the company's internal records.","choices":["convene","comply","allocate","reconcile"],"answer":3,"translation":"経理部門は、銀行取引明細書と社内記録の間にあるいくつかの不一致を照合・解消しようとしています。","explanation":"reconcile discrepancies は「不一致を照合して解消する」。convene＝招集する、comply＝従う、allocate＝配分する。\n重要語句・表現：reconcile discrepancies（不一致を照合して解消する）／bank statements（銀行の取引明細書）／internal records（社内記録）"},{"id":"R03-17","question":"The company has introduced additional security measures to (　　　) the risk of unauthorized access to customer information.","choices":["designate","mitigate","facilitate","accommodate"],"answer":1,"translation":"同社は顧客情報への不正アクセスのリスクを軽減するため、追加のセキュリティ対策を導入しました。","explanation":"mitigate the risk は「リスクを軽減する」。facilitate は促進する、accommodate は対応・収容する。\n重要語句・表現：security measures（セキュリティ対策）／mitigate the risk（リスクを軽減する）／unauthorized access（不正アクセス）"},{"id":"R03-18","question":"The announcement of the new partnership attracted considerable media attention, (　　　) a sharp increase in website traffic.","choices":["prompted","to prompt","prompting","having been prompted"],"answer":2,"translation":"新たな提携の発表はメディアの大きな注目を集め、その結果ウェブサイトへのアクセスが急増しました。","explanation":"現在分詞 prompting が直前の節の結果を表します。「注目を集め、その結果アクセス増を引き起こした」という関係です。\n重要語句・表現：partnership（提携）／media attention（メディアの注目）／prompt a sharp increase（急増を引き起こす）"},{"id":"R03-19","question":"The project budget includes a reserve to cover (　　　) expenses that may arise during the renovation.","choices":["unforeseen","deliberate","provisional","prospective"],"answer":0,"translation":"プロジェクト予算には、改修中に発生する可能性のある予期せぬ費用に備える予備費が含まれています。","explanation":"unforeseen expenses は「予期せぬ費用」。reserve（予備費）と may arise の文脈に合います。\n重要語句・表現：reserve（予備費）／cover unforeseen expenses（予期せぬ費用を賄う）／arise（生じる）"},{"id":"R03-20","question":"Employees (　　　) a valid security clearance may enter the restricted research facility.","choices":["possessed","possession","possess","possessing"],"answer":3,"translation":"有効なセキュリティ許可を持つ従業員は、立ち入り制限のある研究施設に入ることができます。","explanation":"possessing は現在分詞で employees を後ろから修飾します。employees who possess ～ と言い換えられます。\n重要語句・表現：possess（持っている）／security clearance（機密情報へのアクセスなどに関する許可）／restricted research facility（立ち入りが制限された研究施設）"},{"id":"R03-21","question":"(　　　) the preliminary survey results, the marketing team decided to revise its advertising strategy.","choices":["Reviewed","Having reviewed","Having been reviewed","To be reviewing"],"answer":1,"translation":"予備調査の結果を検討したうえで、マーケティングチームは広告戦略を見直すことにしました。","explanation":"Having reviewed は完了形の分詞構文で、主節の決定より前に調査結果を検討したことを示します。\n重要語句・表現：review（検討する）／preliminary survey results（予備調査の結果）／advertising strategy（広告戦略）"},{"id":"R03-22","question":"The new employee training program, the effectiveness of (　　　) will be measured through quarterly assessments, begins next month.","choices":["that","whose","which","what"],"answer":2,"translation":"新しい従業員研修プログラムは来月始まり、その効果は四半期ごとの評価で測定されます。","explanation":"the effectiveness of which は「その効果」。前置詞 of の後に関係代名詞 which を置きます。\n重要語句・表現：effectiveness（効果）／quarterly assessments（四半期ごとの評価）／training program（研修プログラム）"},{"id":"R03-23","question":"(　　　) the potential impact of the new regulations, the executive committee requested further legal advice.","choices":["Recognizing","Recognized","Having been recognized","To be recognized"],"answer":0,"translation":"新規制の潜在的な影響を認識した経営委員会は、さらに法律上の助言を求めました。","explanation":"Recognizing は現在分詞の分詞構文。主語 the executive committee が「影響を認識する」能動関係です。\n重要語句・表現：recognize（認識する）／potential impact（潜在的な影響）／legal advice（法的助言）"},{"id":"R03-24","question":"The department head requested that the revised financial projections (　　　) in the presentation for next week's board meeting.","choices":["have included","are including","had included","be included"],"answer":3,"translation":"部門長は、改訂された財務予測を来週の取締役会向けプレゼンテーションに含めるよう求めました。","explanation":"request that S + 動詞の原形。財務予測は「含まれる」側なので be included を選びます。\n重要語句・表現：financial projections（財務予測）／be included in ～（～に含まれる）／board meeting（取締役会）"},{"id":"R03-25","question":"The growing number of international clients has prompted the law firm to (　　　) additional office space near the financial district.","choices":["insure","secure","assure","ensure"],"answer":1,"translation":"海外顧客の増加を受け、その法律事務所は金融街の近くに追加のオフィススペースを確保することになりました。","explanation":"secure office space は「オフィススペースを確保する」。insure＝保険を掛ける、assure＝安心させる、ensure＝確実にする。\n重要語句・表現：prompt A to do（Aに～するよう促す）／secure office space（オフィススペースを確保する）／financial district（金融街）"},{"id":"R03-26","question":"If the supplier had informed us of the shortage last week, we (　　　) an alternative source of materials before production began.","choices":["arrange","had arranged","could have arranged","will arrange"],"answer":2,"translation":"供給業者が先週品不足を知らせてくれていれば、生産開始前に代替の材料調達先を手配できたでしょう。","explanation":"過去の事実に反する仮定 If + had + 過去分詞 に対し、主節は could have + 過去分詞で過去の可能性を表します。\n重要語句・表現：shortage（不足）／arrange（手配する）／alternative source of materials（代替の資材調達先）"},{"id":"R03-27","question":"The company's expansion into several new markets is expected to increase revenue, (　　　) providing greater financial stability.","choices":["thereby","nevertheless","otherwise","despite"],"answer":0,"translation":"同社の複数の新市場への進出は売上増加につながり、それによって財務の安定性を高めると期待されています。","explanation":"thereby + -ing は「それによって～する」。売上増加の結果として財務が安定することを示します。\n重要語句・表現：expansion into new markets（新市場への進出）／increase revenue（収益を増やす）／financial stability（財務の安定）"},{"id":"R03-28","question":"Only after all the required permits had been issued (　　　) the contractor begin construction on the new facility.","choices":["had","was","has","did"],"answer":3,"translation":"必要な許可がすべて発行されて初めて、請負業者は新施設の建設を開始しました。","explanation":"Only after が文頭に来ると主節で倒置が起こります。過去の一般動詞 begin に対応する助動詞は did です。\n重要語句・表現：required permits（必要な許可証）／issue（発行する）／begin construction（建設を始める）"},{"id":"R03-29","question":"The audit committee recommended that the discrepancies identified in the annual report (　　　) before the document was released to shareholders.","choices":["were resolved","be resolved","have resolved","are resolving"],"answer":1,"translation":"監査委員会は、年次報告書で特定された不一致を、株主への公表前に解消するよう勧告しました。","explanation":"recommend that S + 動詞の原形。discrepancies は「解消される」側なので be resolved が正解です。\n重要語句・表現：audit committee（監査委員会）／resolve discrepancies（不一致を解消する）／shareholders（株主）"},{"id":"R03-30","question":"The consulting firm has developed a contingency plan to ensure that essential services can continue in the event of (　　　) disruptions.","choices":["deliberate","compatible","unforeseen","confidential"],"answer":2,"translation":"コンサルティング会社は、予期せぬ障害が発生した場合でも重要なサービスを継続できるよう、緊急対応計画を策定しました。","explanation":"unforeseen disruptions は「予期せぬ障害」。contingency plan は不測の事態への対応計画です。R03-19の unforeseen を異なる文脈で復習します。\n重要語句・表現：contingency plan（不測の事態への対応計画）／essential services（不可欠なサービス）／unforeseen disruptions（予期せぬ障害・混乱）"}];let picks=Array(questions.length).fill(null),graded=false,started=false,deadline=0,clock=null;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded||!started;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 30 回答済み';document.getElementById('grade').disabled=graded||!started||picks.some(x=>x===null)}
function finish(timedOut=false){if(graded||!started)return;graded=true;clearInterval(clock);const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 30 問正解（'+(n/questions.length*100).toFixed(1)+'%）'+(timedOut?'（時間切れ・未回答は不正解）':'');document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').classList.add('visible');document.getElementById('resetTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})}function tick(){const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent='残り時間 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finish(true)}document.getElementById('grade').addEventListener('click',()=>finish(false));document.getElementById('reset').addEventListener('click',()=>{clearInterval(clock);picks.fill(null);graded=false;started=false;startButton.disabled=false;startButton.textContent='Start Test';document.getElementById('startPanel').classList.remove('hidden-start');document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').classList.remove('visible');document.getElementById('resetTop').hidden=true;document.getElementById('timer').textContent='残り時間 10:00';render();window.scrollTo({top:0,behavior:'smooth'})});const startButton=document.getElementById('startButton');document.getElementById('resetTop').addEventListener('click',()=>document.getElementById('reset').click());startButton.addEventListener('click',()=>{if(started)return;started=true;deadline=Date.now()+600000;clock=setInterval(tick,250);startButton.disabled=true;startButton.textContent='In Progress';document.getElementById('startPanel').classList.add('hidden-start');render()});render();
</script></body></html>
