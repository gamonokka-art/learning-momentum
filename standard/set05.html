<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 05</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 05 / 20</div><h1>Business English Standard</h1><div>Verb Tenses ③｜動詞の時制</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[
{id:"Q021",q:"The shipment (　　　) at the distribution center two hours ago.",o:["arrives", "has arrived", "arrived", "had arrived"],a:2,j:"その貨物は2時間前に配送センターに到着しました。",e:"two hours ago は過去の特定の時点を示すため、過去形 arrived が正解です。現在完了形 has arrived は通常、ago で示す過去の時点と一緒には使いません。過去完了形 had arrived を使うための別の過去の基準時点も示されていません。",v:"shipment（貨物・出荷品）／distribution center（配送センター）"},
{id:"Q022",q:"The human resources team (　　　) interviews with shortlisted candidates since Monday, and the interviews are continuing today.",o:["conducts", "has been conducting", "had conducted", "will conduct"],a:1,j:"人事チームは月曜日から最終候補者との面接を続けており、今日も面接が行われています。",e:"since Monday は月曜日から現在までの継続を示し、the interviews are continuing today が現在も続いていることを明確にしています。継続している活動を表す現在完了進行形 has been conducting が正解です。team はここでは単数扱いです。",v:"human resources team（人事チーム）／shortlisted candidates（選考に残った候補者）／conduct interviews（面接を行う）"},
{id:"Q023",q:"When the inspection team entered the warehouse, several workers (　　　) damaged packages from the storage shelves.",o:["remove", "have removed", "were removing", "will remove"],a:2,j:"検査チームが倉庫に入ったとき、数人の作業員が保管棚から破損した荷物を取り除いているところでした。",e:"When ... entered は過去のある時点を表します。その瞬間に進行していた作業なので、過去進行形 were removing が正解です。several workers は複数主語なので were を使います。",v:"inspection team（検査チーム）／warehouse（倉庫）／remove damaged packages（破損した荷物を取り除く）"},
{id:"Q024",q:"The museum (　　　) more than 50,000 visitors since its reopening in April.",o:["welcomes", "had welcomed", "will welcome", "has welcomed"],a:3,j:"その博物館は4月の再開以来、5万人を超える来館者を迎えています。",e:"since its reopening in April は、4月の再開から現在までの期間を示します。この期間の累積実績を述べるため、現在完了形 has welcomed が正解です。",v:"since its reopening（再開以来）／welcome visitors（来館者を迎える）"},
{id:"Q025",q:"The board of directors will begin reviewing the proposed budget on Monday. By the time the annual shareholders' meeting begins next Friday, the board (　　　) its review.",o:["will have completed", "completed", "have completed", "had completed"],a:0,j:"取締役会は月曜日に予算案の検討を開始します。来週金曜日の年次株主総会が始まるまでには、その検討を完了しているでしょう。",e:"月曜日に検討を開始する予定で、来週金曜日の会議開始までに完了するという未来の前後関係を表します。未来の基準時点までの完了には未来完了形 will have completed が適切です。board はここでは単数扱いで、have completed は主語とも一致しません。",v:"board of directors（取締役会）／proposed budget（予算案）／annual shareholders' meeting（年次株主総会）"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！時制と時間表現を正確に判断できています。':'解説を確認し、時間表現と出来事の前後関係を整理しましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
