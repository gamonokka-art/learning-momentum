<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 07</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 07 / 20</div><h1>Business English Standard</h1><div>Active & Passive Voice ②｜能動態・受動態</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[
{id:"Q031",q:"All electronic devices (　　　) carefully before they are shipped to retail stores.",o:["inspect", "are inspected", "inspecting", "have inspected"],a:1,j:"すべての電子機器は、小売店へ出荷される前に入念に検査されます。",e:"電子機器は「検査される」対象なので受動態を使います。主語 All electronic devices は複数形で、日常的な手順を表す現在形の受動態 are inspected が正解です。",v:"be inspected carefully（入念に検査される）／be shipped to ～（～へ出荷される）"},
{id:"Q032",q:"The customer service representative (　　　) the client's request within an hour of receiving it yesterday.",o:["was processed", "has been processed", "processed", "processing"],a:2,j:"カスタマーサービス担当者は昨日、顧客の依頼を受け取ってから1時間以内に処理しました。",e:"担当者が依頼を「処理した」ので能動態が必要です。yesterday によって過去の出来事とわかるため、過去形 processed が正解です。was processed と has been processed は受動態で、後ろに目的語 the client's request を直接続けられません。",v:"process a request（依頼を処理する）／within an hour of ～（～から1時間以内に）"},
{id:"Q033",q:"The new pedestrian bridge (　　　) by a team of engineers from three different countries.",o:["designed", "has designed", "was designed", "designing"],a:2,j:"その新しい歩道橋は、3か国から集まった技術者のチームによって設計されました。",e:"歩道橋は「設計される」対象であり、by a team of engineers が行為者を表しています。したがって受動態の was designed が正解です。has designed は能動態で、歩道橋が何かを設計したという不自然な意味になります。",v:"pedestrian bridge（歩道橋）／a team of engineers（技術者のチーム）"},
{id:"Q034",q:"The research team (　　　) several promising solutions during the initial testing phase last month.",o:["identified", "was identified", "identifying", "has been identified"],a:0,j:"研究チームは先月の初期試験段階で、いくつかの有望な解決策を見いだしました。",e:"研究チームが解決策を「見いだした」ので能動態です。last month は明確な過去の時点を示すため、過去形 identified が正解です。was identified と has been identified は受動態で、目的語 several promising solutions を直接取れません。",v:"identify a solution（解決策を見いだす）／initial testing phase（初期試験段階）"},
{id:"Q035",q:"The confidential documents (　　　) in a secure cabinet after the audit was completed yesterday.",o:["stored", "were stored", "have stored", "storing"],a:1,j:"機密書類は昨日、監査が終了した後、安全な保管庫に収納されました。",e:"機密書類は「保管される」対象なので受動態です。yesterday によって過去の出来事であることが明確で、複数主語 The confidential documents に一致する were stored が正解です。",v:"confidential documents（機密書類）／secure cabinet（施錠可能な保管庫などの安全な収納場所）"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！能動態と受動態を正確に見分けられています。':'解説を確認して、主語が動作をする側か、される側かを見直しましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
