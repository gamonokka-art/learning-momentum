<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Set 03</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.meta-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.btn.small{padding:8px 12px;font-size:13px;border-radius:8px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}.score-top{background:#e8f2fb;color:#123f66;border:1px solid #c3d9ed;border-radius:10px;padding:12px 16px;margin:-8px 0 20px;font-size:17px;font-weight:800}.score-top[hidden]{display:none}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">5 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Set 03 / 20</span></div><p class="subtitle">Grammar &amp; Vocabulary Mix ③</p><p class="details">解答目安2分・700〜900点レベル</p></header><main><div class="meta"><span>全5問・各問1つ選択してください</span><div class="meta-tools"><span id="progress">0 / 5 回答済み</span><button type="button" class="btn secondary small" id="reset-top">Try Again</button></div></div><div id="scoreTop" class="score-top" role="status" aria-live="polite" hidden></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>Check Score</button><button class="btn secondary" id="reset">Try Again</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id": "Q011", "question": "The revised guidelines are intended to ensure that all customer inquiries are handled (　　　), regardless of the department receiving them.", "choices": ["consistent", "consistency", "consist", "consistently"], "answer": 3, "translation": "改訂された指針は、どの部署が受け付けても顧客からの問い合わせに一貫した対応がなされるようにするためのものだ。", "explanation": ""}, {"id": "Q012", "question": "The company's decision to postpone the product launch was largely (　　　) by concerns about the reliability of its newly developed software.", "choices": ["reimbursed", "prompted", "allocated", "stipulated"], "answer": 1, "translation": "新たに開発したソフトウェアの信頼性に対する懸念が、製品発売を延期する主なきっかけとなった。", "explanation": "prompt = 引き起こす、促す、刺激する\nreimburse = 払い戻す、返金する\nallocate = 割り当てる、配分する\nstipulate = 規定する、明記する"}, {"id": "Q013", "question": "To avoid disrupting daily operations, the company will (　　　) introduce the new inventory management system over a six-month period.", "choices": ["abruptly", "reluctantly", "gradually", "scarcely"], "answer": 2, "translation": "日常業務への支障を避けるため、同社は6か月かけて新しい在庫管理システムを段階的に導入する。", "explanation": ""}, {"id": "Q014", "question": "The human resources department has introduced several initiatives to (　　　) employee retention and reduce staff turnover.", "choices": ["enforce", "enhance", "entail", "endorse"], "answer": 1, "translation": "人事部門は従業員の定着率を高め、離職を減らすためにいくつかの施策を導入した。", "explanation": "enhance employee retention：従業員の定着率を高める"}, {"id": "Q015", "question": "The updated safety standards apply (　　　) all employees, including temporary staff and external contractors working on company premises.", "choices": ["for", "with", "at", "to"], "answer": 3, "translation": "改訂された安全基準は、派遣社員や敷地内で働く外部請負業者を含む全従業員に適用される。", "explanation": ""}];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 5 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}
document.getElementById('grade').addEventListener('click',()=>{graded=true;const n=picks.filter((x,i)=>x===questions[i].answer).length;const scoreText='結果：'+n+' / 5 問正解（'+Math.round(n/questions.length*100)+'%）';document.getElementById('score').textContent=scoreText;document.getElementById('scoreTop').textContent=scoreText;document.getElementById('scoreTop').hidden=false;render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});function tryAgain(){picks.fill(null);graded=false;document.getElementById('score').textContent='';document.getElementById('scoreTop').textContent='';document.getElementById('scoreTop').hidden=true;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('reset').addEventListener('click',tryAgain);document.getElementById('reset-top').addEventListener('click',tryAgain);render();
</script></body></html>
