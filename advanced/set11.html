<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learning Momentum | Business English Advanced Set 11</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2940;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#112b48;color:white;padding:26px max(20px,calc((100vw - 760px)/2))}header .brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.055em;color:#c6d9ed}header .setno{letter-spacing:0;font-size:13px;color:#dce7f2;white-space:nowrap}header .titleline{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}header .questioncount{letter-spacing:0;font-size:13px;color:#fff;white-space:nowrap}header h1{font-size:clamp(23px,4vw,32px);margin:11px 0 7px;line-height:1.25}header .subtitle{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin:0 0 11px;color:#f0f5fb}header .details{margin:0;color:#dce7f2;font-size:14px;line-height:1.6}main{max-width:800px;margin:auto;padding:20px 16px 60px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 22px;color:#50627a;font-size:14px}.q{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #112b4810}.q h2{font-size:15px;color:#316b9c;margin:0 0 12px}.sentence{font-size:17px;line-height:1.75;font-weight:600;margin:0 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer;min-height:50px}.opt:has(input:checked){border-color:#146ba5;background:#e9f4ff}.opt input{accent-color:#176da8}.result{border-top:1px solid #e0e7ee;margin-top:18px;padding-top:14px;line-height:1.8}.result p{margin:5px 0}.correct{color:#14754b}.wrong{color:#af3f34}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:0;border-radius:10px;padding:13px 22px;background:#12669b;color:white;font-weight:700;font-size:16px;cursor:pointer}.btn.secondary{background:#e0e8f1;color:#193b58}.btn:disabled{opacity:.45;cursor:not-allowed}#score{font-size:21px;font-weight:700;margin-top:12px}footer{color:#607188;text-align:center;font-size:13px;padding:10px}@media(max-width:550px){.opts{grid-template-columns:1fr}.q{padding:17px}.sentence{font-size:16px}}
</style></head><body><header><div class="brandline"><span>LEARNING MOMENTUM</span><span class="questioncount">5 Questions</span></div><div class="titleline"><h1>Business English Advanced</h1><span class="setno">Set 11 / 20</span></div><p class="subtitle">Grammar &amp; Vocabulary Mix ⑪</p><p class="details">解答目安2分・700〜900点レベル</p></header><main><nav style="margin:0 0 14px"><a href="index.html" style="color:#12669b;font-weight:650;text-decoration:none">← 全20セットの目次へ</a></nav><div class="meta"><span>全5問・各問1つ選択してください</span><span id="progress">0 / 5 回答済み</span></div><div id="questions"></div><div class="actions"><button class="btn" id="grade" disabled>採点する</button><button class="btn secondary" id="reset">もう一度挑戦</button></div><div id="score" aria-live="polite"></div></main><footer>Developed by EPC TOKYO</footer><script>
const questions=[{"id": "Q051", "question": "Had the project manager been informed of the scheduling conflict earlier, she (　　　) alternative arrangements.", "choices": ["will make", "had made", "would make", "would have made"], "answer": 3, "translation": "プロジェクト責任者が日程の重複をもっと早く知らされていれば、別の手配をしていただろう。", "explanation": "Had ... been informed は If ... had been informed の倒置形。過去の事実に反する仮定。"}, {"id": "Q052", "question": "By the time the external auditors arrive next Monday, the accounting team (　　　) all supporting documentation for the annual financial report.", "choices": ["will have compiled", "will have been compiled", "had compiled", "compiles"], "answer": 0, "translation": "来週月曜日に外部監査人が到着するまでに、経理チームは年次財務報告書の裏付け資料をすべてまとめ終えているだろう。", "explanation": "未来のある時点までの完了を表す未来完了形。"}, {"id": "Q053", "question": "The company's decision to relocate its headquarters was largely (　　　) by the rising cost of maintaining its current premises.", "choices": ["derived", "conveyed", "driven", "enforced"], "answer": 2, "translation": "本社移転の決定は、現在の施設の維持費上昇が主な要因だった。", "explanation": "be driven by ～：～が原動力・主な要因となっている"}, {"id": "Q054", "question": "The annual conference attracted more than 500 participants, many of (　　　) were representatives of international organizations.", "choices": ["which", "whom", "whose", "that"], "answer": 1, "translation": "年次会議には500人以上が参加し、その多くは国際機関の代表者だった。", "explanation": "many of whom：そのうちの多くが"}, {"id": "Q055", "question": "The annual performance review process will proceed as scheduled, (　　　) several department managers have requested additional time to complete their evaluations.", "choices": ["despite", "nevertheless", "regardless", "although"], "answer": 3, "translation": "複数の部門責任者が評価作業のために追加時間を求めているものの、年次業績評価は予定どおり進められる。", "explanation": ""}];let picks=Array(questions.length).fill(null),graded=false;const root=document.getElementById('questions');
function render(){root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='q';const h=document.createElement('h2');h.textContent=q.id;section.append(h);const s=document.createElement('p');s.className='sentence';s.textContent=q.question;section.append(s);const options=document.createElement('div');options.className='opts';q.choices.forEach((v,k)=>{const lab=document.createElement('label');lab.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=picks[i]===k;input.disabled=graded;input.addEventListener('change',()=>{picks[i]=k;updateProgress()});lab.append(input,document.createTextNode('('+String.fromCharCode(65+k)+') '+v));options.append(lab)});section.append(options);if(graded){const r=document.createElement('div');r.className='result';const verdict=document.createElement('p');verdict.className=picks[i]===q.answer?'correct':'wrong';verdict.textContent=(picks[i]===q.answer?'✓ 正解':'✕ 不正解')+'｜正解：('+String.fromCharCode(65+q.answer)+') '+q.choices[q.answer];r.append(verdict);const trans=document.createElement('p');trans.textContent='日本語訳：'+q.translation;r.append(trans);if(q.explanation){const expl=document.createElement('p');expl.style.whiteSpace='pre-line';expl.textContent='解説：'+q.explanation;r.append(expl)}section.append(r)}root.append(section)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=picks.filter(x=>x!==null).length+' / 5 回答済み';document.getElementById('grade').disabled=graded||picks.some(x=>x===null)}
document.getElementById('grade').addEventListener('click',()=>{graded=true;const n=picks.filter((x,i)=>x===questions[i].answer).length;document.getElementById('score').textContent='結果：'+n+' / 5 問正解';render();document.getElementById('grade').disabled=true;document.getElementById('score').scrollIntoView({behavior:'smooth',block:'nearest'})});document.getElementById('reset').addEventListener('click',()=>{picks.fill(null);graded=false;document.getElementById('score').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
