<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEARNING MOMENTUM | Business English Standard Set 08</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#182638;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}header{background:#133652;color:white;padding:27px;border-radius:16px}h1{margin:7px 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 16px}.sub{opacity:.84}.card{background:white;padding:24px;border-radius:14px;margin:17px 0;box-shadow:0 3px 15px #142c4510}.question{font-size:1.08rem;font-weight:650;line-height:1.8;margin:12px 0 18px}.option{display:block;border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:#236c91;background:#eaf5fa}input{margin-right:10px}button{padding:13px 22px;border:0;border-radius:9px;background:#12648b;color:white;font-weight:bold;cursor:pointer;font-size:1rem}button.secondary{background:#e4ebf0;color:#173348}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.explanation{border-top:1px solid #e0e6ec;margin-top:18px;padding-top:16px;line-height:1.8}.correct{color:#187347;font-weight:700}.incorrect{color:#bd3941;font-weight:700}.score{font-size:1.4rem;font-weight:750}footer{font-size:.82rem;color:#617184;text-align:center;margin-top:28px}.hidden{display:none}small{color:#52687a}
</style></head><body><main class="wrap"><header><div class="sub">LEARNING MOMENTUM · STANDARD · SET 08 / 20</div><h1>Business English Standard</h1><div>Word Forms ①｜品詞の選択</div><p class="sub">5 Questions · 解答目安 2分 · 500〜700点レベル</p></header><div id="quiz"></div><div class="card"><div id="progress">回答済み 0 / 5問</div><div class="actions"><button id="grade" disabled>採点して解説を見る</button><button id="reset" class="secondary">最初から解く</button></div><div id="result" aria-live="polite"></div></div><footer>LEARNING MOMENTUM · English Learning & Pronunciation</footer></main><script>
const questions=[
{"id":"Q036","q":"The company's decision to expand into overseas markets was based on a (　　　) analysis of consumer demand.","o":["care","carefully","careful","caring"],"a":2,"j":"海外市場へ進出するという会社の決定は、消費者需要の慎重な分析に基づいていました。","e":"空欄は名詞 analysis を修飾する位置なので形容詞が必要です。careful（慎重な）が正解です。care は名詞・動詞、carefully は副詞です。caring は「思いやりのある」という意味で、この文脈には合いません。","v":"be based on ～（～に基づく）／consumer demand（消費者需要）"},
{"id":"Q037","q":"The newly appointed supervisor handled the unexpected situation with remarkable (　　　).","o":["calming","calmly","calmness","calmed"],"a":2,"j":"新任の監督者は、予期しない事態に驚くほど落ち着いて対処しました。","e":"前置詞 with の後ろには名詞句が必要です。remarkable は形容詞なので、その後ろに名詞 calmness（落ち着き）が入ります。calmly は副詞、calming と calmed はこの位置で「落ち着き」という名詞にはなりません。","v":"handle a situation（状況に対処する）／with remarkable calmness（驚くほど落ち着いて）"},
{"id":"Q038","q":"The conference organizers provided (　　　) instructions for participants arriving from overseas.","o":["detail","detailed","detailing","details"],"a":1,"j":"会議の主催者は、海外から到着する参加者に詳細な案内を提供しました。","e":"空欄は名詞 instructions を修飾します。detailed（詳細な）が適切です。detail は名詞・動詞、details は複数名詞などです。detailing は「詳述している」という現在分詞ですが、ここでは instructions の内容が詳細であることを表す detailed が自然です。","v":"detailed instructions（詳細な案内）／conference organizers（会議の主催者）"},
{"id":"Q039","q":"The new mobile application allows customers to track their orders more (　　　) than before.","o":["convenient","convenience","conveniently","conveniences"],"a":2,"j":"新しいモバイルアプリによって、顧客は以前より便利に注文の配送状況を追跡できます。","e":"動詞 track を修飾する副詞が必要です。more conveniently than before で「以前より便利に」という比較表現になります。convenient は形容詞、convenience は名詞です。","v":"track an order（注文状況を追跡する）／more conveniently than before（以前より便利に）"},
{"id":"Q040","q":"The hotel management team expressed its (　　　) to all staff members who worked during the holiday season.","o":["appreciate","appreciative","appreciatively","appreciation"],"a":3,"j":"ホテルの経営陣は、休暇シーズン中に勤務したすべてのスタッフに感謝の意を表しました。","e":"所有格 its の後ろで動詞 expressed の目的語となる名詞が必要です。appreciation（感謝）が正解で、express appreciation to ～ は「～に感謝の意を表す」という定型表現です。","v":"express appreciation（感謝の意を表す）／holiday season（休暇シーズン）"}];
const quiz=document.querySelector('#quiz');const letters='ABCD';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}quiz.innerHTML=questions.map((x,i)=>`<section class="card" id="${x.id}"><h2>${x.id}</h2><div class="question">${esc(x.q)}</div>${x.o.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}">(${letters[k]}) ${esc(o)}</label>`).join('')}<div class="explanation hidden" id="exp${i}"></div></section>`).join('');
function selected(i){const e=document.querySelector(`input[name=q${i}]:checked`);return e?Number(e.value):null}function progress(){const n=questions.filter((_,i)=>selected(i)!==null).length;document.querySelector('#progress').textContent=`回答済み ${n} / 5問`;document.querySelector('#grade').disabled=n!==5}quiz.addEventListener('change',()=>{progress();document.querySelector('#result').textContent='';questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'))});document.querySelector('#grade').addEventListener('click',()=>{let score=0;questions.forEach((x,i)=>{const ok=selected(i)===x.a;if(ok)score++;const el=document.querySelector('#exp'+i);el.classList.remove('hidden');el.innerHTML=`<div class="${ok?'correct':'incorrect'}">${ok?'正解':'不正解'} · 正解 (${letters[x.a]}) ${esc(x.o[x.a])}</div><p><strong>和訳：</strong>${esc(x.j)}</p><p><strong>解説：</strong>${esc(x.e)}</p><small><strong>重要表現：</strong>${esc(x.v)}</small>`});document.querySelector('#result').innerHTML=`<div class="score">結果：${score} / 5問</div><p>${score===5?'全問正解！文中で必要な品詞を正確に判断できています。':'解説を確認して、空欄の前後から必要な品詞を判断しましょう。'}</p>`;document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})});document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((_,i)=>document.querySelector('#exp'+i).classList.add('hidden'));document.querySelector('#result').textContent='';progress();window.scrollTo({top:0,behavior:'smooth'})});progress();
</script></body></html>
